<style>
  :root {
    --paper: #FBF7EE;
    --paper-line: rgba(34, 53, 95, 0.055);
    --ink: #23304a;
    --ink-soft: #5b6785;
    --navy: #22355F;
    --navy-dark: #16233d;
    --navy-tint: #eef1f7;
    --marigold: #E3A430;
    --marigold-dark: #b9821f;
    --red: #b8433a;
    --red-tint: #f8e9e7;
    --green: #3f7d58;
    --green-tint: #e8f2ec;
    --card-bg: #ffffff;
    --border: rgba(34, 53, 95, 0.16);
    --radius: 6px;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #171c28; --paper-line: rgba(255,255,255,0.05); --ink: #eef1f7; --ink-soft: #a6afc7;
      --navy: #6f8ec2; --navy-dark: #3c568a; --navy-tint: #202940;
      --marigold: #eab84c; --marigold-dark: #eab84c; --red: #e07469; --red-tint: #3a2422;
      --green: #6fbd8e; --green-tint: #1d2f26; --card-bg: #1f2434; --border: rgba(255,255,255,0.14);
    }
  }
  :root[data-theme="dark"] {
    --paper: #171c28; --paper-line: rgba(255,255,255,0.05); --ink: #eef1f7; --ink-soft: #a6afc7;
    --navy: #6f8ec2; --navy-dark: #3c568a; --navy-tint: #202940;
    --marigold: #eab84c; --marigold-dark: #eab84c; --red: #e07469; --red-tint: #3a2422;
    --green: #6fbd8e; --green-tint: #1d2f26; --card-bg: #1f2434; --border: rgba(255,255,255,0.14);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; background-color: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, var(--paper-line) 0, var(--paper-line) 1px, transparent 1px, transparent 28px),
      repeating-linear-gradient(90deg, var(--paper-line) 0, var(--paper-line) 1px, transparent 1px, transparent 28px);
    color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; min-height: 100%;
  }
  h1, h2, h3, .display { font-family: var(--font-display); font-weight: 600; color: var(--navy); letter-spacing: -0.01em; }
  a { color: var(--navy); }
  button, input, select { font-family: inherit; }
  input, select { color: var(--ink); background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 4px; padding: 8px 10px; font-size: 0.88rem; }

  .topbar { position: sticky; top: 0; z-index: 40; padding: calc(12px + env(safe-area-inset-top, 0px)) 20px 12px; background: var(--paper); border-bottom: 2px solid var(--navy); display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .brand-mark { width: 46px; height: 38px; flex-shrink: 0; object-fit: contain; display: block; }
  .brand-text { min-width: 0; }
  .brand-text .name { font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; color: var(--navy); line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-text .tag { font-size: 0.74rem; color: var(--ink-soft); }
  .staff-link { background: none; border: none; color: var(--ink-soft); font-weight: 700; font-size: 0.78rem; cursor: pointer; text-decoration: underline; white-space: nowrap; }
  .cart-btn { position: relative; background: var(--marigold); color: var(--navy-dark); border: none; border-radius: 4px; padding: 9px 14px; font-weight: 800; font-size: 0.88rem; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .cart-btn:active { transform: translateY(1px); }
  .cart-count { background: var(--red); color: #fff; border-radius: 50%; min-width: 19px; height: 19px; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; padding: 0 4px; }

  .tabs { display: flex; gap: 4px; padding: 10px 20px 0; overflow-x: auto; max-width: 980px; margin: 0 auto; }
  .tab { border: none; background: transparent; color: var(--ink-soft); font-weight: 700; font-size: 0.86rem; padding: 9px 4px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tab.active { color: var(--navy); border-bottom-color: var(--marigold); }

  main { max-width: 980px; margin: 0 auto; padding: 22px 20px 120px; }

  .steps { display: flex; flex-wrap: wrap; gap: 6px 0; margin-bottom: 22px; font-size: 0.82rem; color: var(--ink-soft); }
  .steps .s { display: flex; align-items: center; gap: 6px; padding-right: 14px; }
  .steps .s.done { color: var(--green); }
  .steps .s.current { color: var(--navy); font-weight: 800; }
  .steps .sep { padding-right: 14px; }

  section.view { animation: fadein .2s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px);} to {opacity:1; transform:none;} }

  .hero { padding: 10px 0 28px; }
  .hero h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); margin: 0 0 8px; max-width: 20ch; }
  .hero p { color: var(--ink-soft); max-width: 52ch; margin: 0; }

  .cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 22px; }
  .cat-card { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 20px; cursor: pointer; text-align: left; }
  .cat-card:hover { border-color: var(--navy); }
  .cat-card .icon { font-size: 1.8rem; margin-bottom: 10px; display: block; }
  .cat-card h3 { margin: 0 0 4px; font-size: 1.15rem; }
  .cat-card p { margin: 0; color: var(--ink-soft); font-size: 0.88rem; }

  .grade-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
  .grade-card { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 4px; padding: 16px 14px 14px; cursor: pointer; text-align: left; position: relative; }
  .grade-card::before { content: ""; position: absolute; top: 0; right: 0; width: 0; height: 0; border-style: solid; border-width: 0 16px 16px 0; border-color: transparent var(--border) transparent transparent; }
  .grade-card:hover { border-color: var(--navy); }
  .grade-card .num { font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; color: var(--navy); line-height: 1; }
  .grade-card .lbl { font-size: 0.78rem; color: var(--ink-soft); margin-top: 4px; }
  .grade-card .price { margin-top: 10px; font-size: 0.82rem; font-weight: 700; }

  .backlink { background: none; border: none; color: var(--navy); font-weight: 700; font-size: 0.86rem; cursor: pointer; padding: 0 0 16px; display: inline-flex; align-items: center; gap: 6px; }

  .preset-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 20px; }

  .section-block { margin-top: 22px; }
  .section-title { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.04em; color: var(--navy); border-bottom: 2px solid var(--border); padding-bottom: 6px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: baseline; }
  .section-title button { background: none; border: none; color: var(--navy); font-weight: 800; font-size: 0.72rem; cursor: pointer; text-decoration: underline; }

  .item-row { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .item-row .info { flex: 1; min-width: 180px; }
  .item-row .desc { font-weight: 700; font-size: 0.93rem; }
  .item-row.unselected .desc { color: var(--ink-soft); }
  .item-row .qty { font-size: 0.8rem; color: var(--ink-soft); }
  .item-row .amt { font-weight: 800; font-size: 0.93rem; white-space: nowrap; min-width: 66px; text-align: right; }

  .stepper { display: flex; align-items: center; border: 1.5px solid var(--border); border-radius: 4px; overflow: hidden; flex-shrink: 0; }
  .stepper button { background: var(--navy-tint); border: none; width: 28px; height: 32px; font-size: 1rem; cursor: pointer; color: var(--navy); }
  .stepper input { border: none; width: 42px; text-align: center; padding: 0; border-radius: 0; }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .uniform-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
  .uniform-card { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .uniform-card .swatch { width: 100%; height: 64px; border-radius: 4px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
  .uniform-card h4 { margin: 0 0 2px; font-size: 0.98rem; }
  .uniform-card .price { color: var(--navy); font-weight: 800; margin-bottom: 10px; }
  .field-row { display: flex; gap: 8px; margin-bottom: 10px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 5px; padding: 11px 18px; font-weight: 800; font-size: 0.92rem; cursor: pointer; }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-primary:disabled { background: var(--border); color: var(--ink-soft); cursor: not-allowed; }
  .btn-secondary { background: var(--card-bg); color: var(--navy); border: 1.5px solid var(--navy); }
  .btn-ghost { background: none; color: var(--red); border: none; font-weight: 700; font-size: 0.82rem; text-decoration: underline; cursor: pointer; padding: 4px; }
  .btn-block { width: 100%; }
  .btn-sm { padding: 7px 12px; font-size: 0.8rem; }

  .summary-bar { position: sticky; bottom: 0; margin-top: 26px; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .summary-bar .tot .label { font-size: 0.74rem; color: var(--ink-soft); }
  .summary-bar .tot .amt { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; color: var(--navy); }

  .cart-table { width: 100%; border-collapse: collapse; }
  .cart-table th { text-align: left; font-size: 0.72rem; letter-spacing: 0.03em; color: var(--ink-soft); border-bottom: 2px solid var(--border); padding-bottom: 8px; }
  .cart-table td { padding: 10px 6px; border-bottom: 1px solid var(--border); vertical-align: top; font-size: 0.88rem; }
  .cart-table td.num { text-align: right; white-space: nowrap; }
  .cart-table tr:hover td { background: var(--navy-tint); }
  .cart-group-title { font-weight: 800; color: var(--navy); padding-top: 16px !important; border-bottom: none !important; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .empty-state .big { font-size: 2.4rem; margin-bottom: 10px; }

  .totals-block { margin-top: 18px; max-width: 320px; margin-left: auto; }
  .totals-block .row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 0.9rem; }
  .totals-block .row.grand { border-top: 2px solid var(--navy); margin-top: 6px; padding-top: 10px; font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; color: var(--navy); }

  .choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .choice-card { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 18px; cursor: pointer; text-align: left; }
  .choice-card.selected { border-color: var(--navy); border-width: 2px; background: var(--navy-tint); }
  .choice-card .icon { font-size: 1.5rem; }
  .choice-card h4 { margin: 8px 0 4px; }
  .choice-card p { margin: 0; font-size: 0.85rem; color: var(--ink-soft); }

  .map-wrap { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-top: 6px; }
  .map-wrap svg { width: 100%; height: auto; display: block; border-radius: 4px; cursor: crosshair; touch-action: none; }
  .map-legend { display: flex; gap: 18px; margin-top: 10px; font-size: 0.78rem; color: var(--ink-soft); flex-wrap: wrap; }
  .map-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .fee-box { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding: 12px 14px; background: var(--navy-tint); border-radius: 4px; flex-wrap: wrap; gap: 8px; }
  .fee-box .km { font-weight: 700; }
  .fee-box .fee { font-family: var(--font-display); font-weight: 700; color: var(--navy); font-size: 1.1rem; }
  .manual-km { margin-top: 10px; font-size: 0.82rem; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .manual-km input { width: 70px; }

  .pay-detail { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 18px; margin-top: 14px; }
  .bank-box { background: var(--navy-tint); border-radius: 4px; padding: 14px; font-size: 0.88rem; margin-bottom: 14px; }
  .bank-box div { padding: 2px 0; }
  .bank-box b { color: var(--navy); }
  .upload-zone { border: 2px dashed var(--border); border-radius: 4px; padding: 20px; text-align: center; cursor: pointer; display: block; }
  .upload-zone:hover { border-color: var(--navy); }
  .upload-zone input { display: none; }
  .preview-img { max-width: 100%; max-height: 220px; border-radius: 4px; margin-top: 12px; border: 1.5px solid var(--border); display: block; }
  .note-box { background: var(--green-tint); color: var(--green); border-radius: 4px; padding: 12px 14px; font-size: 0.88rem; font-weight: 700; }
  .note-box.error { background: var(--red-tint); color: var(--red); }
  .note-box.neutral { background: var(--navy-tint); color: var(--navy); }
  .asign-overlay { position: fixed; inset: 0; background: rgba(23,28,40,0.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 500; }
  .asign-modal { background: var(--card-bg); border-radius: var(--radius); padding: 22px; max-width: 420px; width: 100%; max-height: 86vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.25); }
  .split-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; flex-wrap: wrap; }
  .split-row .nombre { font-size: 0.86rem; }
  .stepper.unbalanced button { color: var(--red); border-color: var(--red); }
  .split-warning { color: var(--red); font-size: 0.8rem; font-weight: 700; margin-top: 4px; }
  .alumno-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--navy-tint); color: var(--navy); border-radius: 20px; padding: 5px 12px; font-size: 0.82rem; font-weight: 700; }

  .receipt { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 8px; padding: 26px; position: relative; }
  .receipt h2 { margin: 0 0 2px; }
  .receipt .ord { color: var(--ink-soft); font-size: 0.85rem; margin-bottom: 16px; }
  .receipt hr { border: none; border-top: 1.5px dashed var(--border); margin: 14px 0; }
  .rline { display: flex; justify-content: space-between; font-size: 0.88rem; padding: 3px 0; gap: 12px; }
  .rline > span:first-child { color: var(--ink-soft); flex-shrink: 0; }
  .rline > span:last-child { text-align: right; font-weight: 700; }
  .badge { display: inline-block; color: #fff; font-weight: 800; font-size: 0.72rem; padding: 3px 9px; border-radius: 20px; }
  .badge.gold { background: var(--marigold); color: var(--navy-dark); margin-bottom: 8px; }

  .field-col { margin-bottom: 14px; display: flex; flex-direction: column; gap: 5px; }
  .field-col label { font-size: 0.8rem; font-weight: 800; color: var(--navy); }
  .field-col input, .field-col select { padding: 9px 10px; }

  .login-wrap { display: flex; justify-content: center; padding-top: 10px; }
  .login-card { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 8px; padding: 30px; max-width: 360px; width: 100%; }

  .disclaimer { max-width: 980px; margin: 0 auto; padding: 10px 20px; text-align: center; font-size: 0.74rem; color: var(--ink-soft); }

  @media (max-width: 640px) {
    main { padding: 18px 14px 120px; }
    .brand-text .tag { display: none; }
    .totals-block { max-width: none; }
    .item-row .amt { text-align: left; margin-left: 34px; }
  }

function slug(str){
  return String(str).trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
}

async function loadListas(){
  const snap = await getDocs(collection(db, 'listas'));
  const g = {};
  snap.forEach(d => {
    const data = d.data();
    g[data.nombre] = { docId: d.id, items: data.items, total_libros: data.total_libros, total_paquete: data.total_paquete };
  });
  GRADES = g;

function money(n){ return '$' + Number(n||0).toLocaleString('es-MX', {minimumFractionDigits:0, maximumFractionDigits:2}); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function idSafe(s){ return String(s).replace(/[^a-zA-Z0-9_-]/g, '_'); }
function fmtDate(d){ return new Date(d).toLocaleDateString('es-MX', {weekday:'long', day:'numeric', month:'long'}); }

function addBusinessDays(date, days){
  const d = new Date(date);
  let added = 0;
  while(added < days){
    d.setDate(d.getDate()+1);
    const day = d.getDay();
    if(day !== 0 && day !== 6) added++;
  }
  return d;
}

// una "canasta" (basketId) es normalmente el nombre del grado tal cual ("1° PRIMARIA"), pero cuando
// hay gemelos/cuates en el mismo grado se crean canastas extra con sufijo ("1° PRIMARIA#2", "#3"...)
// para que cada alumno tenga su propia lista independiente del mismo grado.
function gradeNameOf(basketId){
  return basketId.split('#')[0];
}
function basketsForGrade(grade){
  return Object.keys(state.gradeQtys).filter(k => gradeNameOf(k)===grade);
}
function newBasketId(grade){
  let n = 2;
  while(state.gradeQtys[grade+'#'+n] !== undefined) n++;
  return grade+'#'+n;
}
function ensureGradeQtys(basketId){
  if(!state.gradeQtys[basketId]){
    const qtys = {};
    GRADES[gradeNameOf(basketId)].items.forEach((it,i) => qtys[i] = it.cantidad); // por defecto: cantidad sugerida completa
    state.gradeQtys[basketId] = qtys;
  }
  return state.gradeQtys[basketId];
}

function gradeSubtotal(basketId){
  const qtys = state.gradeQtys[basketId];
  if(!qtys) return 0;
  return GRADES[gradeNameOf(basketId)].items.reduce((sum, it, i) => sum + ((qtys[i]||0) * it.precio_unitario), 0);
}
function utilesTotal(){
  return Object.keys(state.gradeQtys).reduce((s,g) => s + gradeSubtotal(g), 0);
}
function utilesCount(){
  return Object.keys(state.gradeQtys).reduce((s,g) => s + Object.values(state.gradeQtys[g]).reduce((a,b)=>a+(b||0),0), 0);
}
function uniformsTotal(){
  return state.uniformCart.reduce((s,u) => s + (UNIFORMS.find(x=>x.id===u.id).price * u.qty), 0);
}
function uniformsCount(){
  return state.uniformCart.reduce((s,u)=>s+u.qty, 0);
}
function cartCount(){ return utilesCount() + uniformsCount(); }
function cartSubtotal(){ return utilesTotal() + uniformsTotal(); }

function deliveryKm(){
  return (state.kmAuto !== null && state.kmAuto !== undefined) ? state.kmAuto : null;
}

const STORE_ADDRESS = 'Azcapotzalco 5, Merced Gómez, Álvaro Obregón, 01600 Ciudad de México, CDMX';
const STORE_FALLBACK = { lat: 19.3590, lng: -99.1880 };   // respaldo aproximado (colonia Merced Gómez)
const ROAD_FACTOR = 1.3;                                   // la distancia en línea recta se ajusta x1.3 para aproximar calles reales
function haversineKm(a, b){
  const R = 6371, toRad = d => d*Math.PI/180;
  const dLat = toRad(b.lat-a.lat), dLng = toRad(b.lng-a.lng);
  const x = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
async function geocodeAddress(q){
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=mx&accept-language=es&q=' + encodeURIComponent(q);
  const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
  if(!res.ok) throw new Error('geo-http-' + res.status);
  const arr = await res.json();
  if(!arr.length) return null;
  return { lat: parseFloat(arr[0].lat), lng: parseFloat(arr[0].lon) };
}
async function calcularDistancia(){
  const dir = state.direccion.trim();
  if(dir.length < 8) return;
  state.geoStatus = 'loading'; state.geoMessage = ''; render();
  try{
    if(!state.storeCoords){
      let c = null;
      try{ c = await geocodeAddress(STORE_ADDRESS); }catch(e){ console.warn('No se pudo ubicar el local, usando respaldo', e); }
      state.storeCoords = c || STORE_FALLBACK;
    }
    const dest = await geocodeAddress(dir);
    if(!dest){
      state.geoStatus = 'error'; state.kmAuto = null;
      state.geoMessage = 'No pudimos ubicar esa dirección. Agrega colonia, alcaldía/municipio o código postal, y vuelve a intentar.';
    } else {
      state.kmAuto = Math.round(haversineKm(state.storeCoords, dest) * ROAD_FACTOR * 10) / 10;
      state.geoStatus = 'ok'; state.geoMessage = '';
    }
  }catch(e){
    console.error(e);
    state.geoStatus = 'error'; state.kmAuto = null;
    state.geoMessage = 'No pudimos calcular la distancia en este momento. Revisa tu conexión e intenta de nuevo.';
  }
  render();
}
function deliveryFee(){
  if(state.fulfillment !== 'delivery') return 0;
  const km = deliveryKm();
  if(km === null) return null;
  return Math.round(DELIVERY_BASE + km * DELIVERY_PER_KM);
}
function grandTotal(){
  const fee = deliveryFee();
  return cartSubtotal() + (fee || 0);
}
function computeEstimatedReady(){
  const days = state.fulfillment === 'delivery' ? 2 : 1;

async function buildOrder(){
  const utilesItems = [];
  Object.keys(state.gradeQtys).forEach(g => {
    const realGrade = gradeNameOf(g);
    GRADES[realGrade].items.forEach((it,i) => {
      const qty = state.gradeQtys[g][i] || 0;
      if(qty>0) utilesItems.push({ descripcion: it.descripcion, qty, precio_unitario: it.precio_unitario, seccion: it.seccion || 'MATERIAL DIARIO', grade: realGrade, studentId: state.gradeAssign[g]||null, invKey: GRADES[realGrade].docId+'_'+i });
    });
  });
  const uniformItems = state.uniformCart.map(u => {
    const info = UNIFORMS.find(x=>x.id===u.id);
    const splits = Object.entries(u.assign||{}).filter(([,q])=>q>0).map(([studentId,q]) => ({studentId, qty:q}));
    return { id:u.id, name:info.name, size:u.size, qty:u.qty, price:info.price, splits, invKey: u.id+'_'+u.size };
  });
  const allItems = [...utilesItems, ...uniformItems];
  const totales = { papeleria: 0, libros: 0, uniformesDetalle: {} };
  utilesItems.forEach(it => { const t = it.qty*it.precio_unitario; if(it.seccion==='LIBROS') totales.libros += t; else totales.papeleria += t; });
  uniformItems.forEach(u => { totales.uniformesDetalle[u.name] = (totales.uniformesDetalle[u.name]||0) + u.qty*u.price; });
  const fee = deliveryFee() || 0;
  const folio = 'AD-' + Math.floor(1000 + Math.random()*9000);
  const alumnos = alumnosActivosEnCarrito().map(al => ({ id:al.id, nombres:al.nombres, apellidoPaterno:al.apellidoPaterno, apellidoMaterno:al.apellidoMaterno, grado:al.grado||'' }));

  let comprobanteUrl = null;
  if(state.payment === 'transferencia' && state.comprobanteFile){
    const sref = storageRef(storage, `comprobantes/${folio}/comprobante.jpg`);
    await uploadBytes(sref, state.comprobanteFile);
    comprobanteUrl = await getDownloadURL(sref);
  }

  const order = {
    folio,
    createdAt: new Date().toISOString(),
    cliente: Object.assign({}, state.cliente),
    alumnos,
    items: {
      utiles: utilesItems.map(({invKey, ...rest}) => rest),
      uniformes: uniformItems.map(({invKey, ...rest}) => rest),
    },
    fulfillment: state.fulfillment,
    direccion: state.fulfillment==='delivery' ? state.direccion.trim() : '',
    deliveryFee: fee,
    deliveryKm: deliveryKm(),
    payment: state.payment,
    comprobante: comprobanteUrl,
    totales,
    pagoConfirmado: false,
    pagoConfirmadoAt: null,
    capturadoInnovat: false,
    subtotal: cartSubtotal(),
    total: grandTotal(),
    stageIndex: 0,
    ubicacion: '',
    signature: null,
    recibioNombre: null,
    completedAt: null,
    estimatedReady: computeEstimatedReady().toISOString(),
    smsLog: [{ message: `Liceo Alexander Dul: recibimos tu pedido ${folio} por ${money(cartSubtotal()+fee)}. Te avisaremos por mensaje conforme avance tu pedido.`, at: new Date().toISOString() }],
    historial: [{ texto: 'Pedido creado por el cliente', por: 'Cliente', at: new Date().toISOString() }],
    checklist: {},
  };

  // una llave de búsqueda por cada alumno (nombre completo + teléfono), todas apuntando al mismo folio,
  // para que desde "olvidé mi folio" se pueda encontrar el pedido con el nombre de cualquiera de los hermanos.
  const telDigits = state.cliente.telefono.replace(/\D/g,'');
  const busquedaKeys = alumnos.map(al => slug(nombreCompleto(al)) + '_' + telDigits);

  await runTransaction(db, async (tx) => {
    const invRefs = allItems.map(it => doc(db, 'inventario', it.invKey));
    const snaps = await Promise.all(invRefs.map(r => tx.get(r)));
    const orderRef = doc(db, 'pedidos', folio);
    tx.set(orderRef, order);
    busquedaKeys.forEach(key => tx.set(doc(db, 'busquedas', key), { folio }));
    invRefs.forEach((r, i) => {
      const current = snaps[i].exists() ? (snaps[i].data().stock || 0) : 0;
      tx.update(r, { stock: Math.max(0, current - allItems[i].qty) });
    });
  });

  allItems.forEach(it => {
    state.inventory[it.invKey] = Math.max(0, (state.inventory[it.invKey]||0) - it.qty);
  });
  state.orders.push(order);
  return order;
}

    return `<span class="s ${cls}">${i<idx?'✓ ':(i+1)+'. '}${l}</span>${i<steps.length-1?'<span class="sep">→</span>':''}`;
  }).join('')}</div>`;
}

function viewFor(tab){
  switch(tab){
    case 'utiles': return state.gradePendingChoice ? gradeChooserView(state.gradePendingChoice) : (state.grade ? gradeListView(state.grade) : gradeGridView());
    case 'uniformes': return uniformsView();
    case 'carrito': return cartView();
    case 'rastreo': return trackView();
    case 'datos': return clienteView();
    case 'entrega': return deliveryView();
    case 'pago': return paymentView();
    case 'confirmacion': return confirmationView();
    default: return homeView();
  }
}

function gradeListView(basketId){
  const grade = gradeNameOf(basketId);
  const data = GRADES[grade];
  const qtys = ensureGradeQtys(basketId);
  const label = grade.replace(' PRIMARIA','').trim();
  const sections = ['MATERIAL DIARIO','PARA FORRAR','LIBROS'];
  const sectionLabels = {'MATERIAL DIARIO':'Material de uso diario', 'PARA FORRAR':'Para forrar', 'LIBROS':'Libros de texto'};
  const sub = gradeSubtotal(basketId);
  const gid = idSafe(basketId);
  const dueño = state.gradeAssign[basketId] ? studentById(state.gradeAssign[basketId]) : null;
  const otrasCanastas = basketsForGrade(grade).length > 1;

  const sectionsHtml = sections.map(sec => {
    const rows = data.items.map((it,i) => ({it,i})).filter(x => x.it.seccion === sec);
    if(!rows.length) return '';
    return `
    <div class="section-block">
      <div class="section-title">
        <span>${sectionLabels[sec]}</span>
        <button data-toggle-section="${sec}" data-grade="${esc(basketId)}">activar/desactivar todo</button>
      </div>
      ${rows.map(({it,i}) => {
        const qty = qtys[i]||0;
        const stockKey = GRADES[grade].docId+'_'+i;
        const stock = state.inventory[stockKey];
        return `
        <div class="item-row ${qty>0?'':'unselected'}">
          <div class="info">
            <div class="desc">${esc(it.descripcion)}</div>
            <div class="qty">Sugerido: ${it.cantidad} · P. unitario ${money(it.precio_unitario)} ${stock!==undefined && stock<5 ? '· <span style="color:var(--red)">pocas existencias</span>' : ''}</div>
          </div>
          <div class="stepper">
            <button type="button" data-qty-dec="${i}" data-grade="${esc(basketId)}">−</button>
            <input type="text" inputmode="numeric" pattern="[0-9]*" id="qty_${gid}_${i}" value="${qty}" data-qty-input="${i}" data-grade="${esc(basketId)}">
            <button type="button" data-qty-inc="${i}" data-grade="${esc(basketId)}">+</button>
          </div>
          <div class="amt">${money(qty*it.precio_unitario)}</div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');

  return `
  <section class="view">
    <button class="backlink" data-back-grades="1">← Cambiar de grado</button>
    <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;">
      <h2 style="margin:0">${esc(label)} de primaria${dueño ? ' <span style="font-size:0.7em; color:var(--ink-soft); font-weight:400;">· para '+esc(nombreCompleto(dueño))+'</span>' : ''}</h2>
      <button class="btn btn-secondary btn-sm" data-download-lista="${esc(grade)}">🖨️ Descargar / imprimir lista (PDF)</button>
    </div>
    ${otrasCanastas ? `<div class="note-box neutral" style="margin-bottom:10px;">Tienes más de una lista de ${esc(label)} de primaria en este pedido (por ejemplo, gemelos en el mismo grado). Entra desde el carrito a "editar esta lista" para no confundirlas.</div>` : ''}
    <div class="preset-row">
      <button class="btn btn-secondary btn-sm" data-preset="completo" data-grade="${esc(basketId)}">📦 Paquete completo</button>
      <button class="btn btn-secondary btn-sm" data-preset="libros" data-grade="${esc(basketId)}">📚 Solo libros</button>
      <button class="btn btn-secondary btn-sm" data-preset="diario" data-grade="${esc(basketId)}">✏️ Solo material diario</button>
      <button class="btn btn-secondary btn-sm" data-preset="ninguno" data-grade="${esc(basketId)}">✖️ Quitar todo</button>
    </div>
    ${sectionsHtml}
    <div class="summary-bar">
      <div class="tot"><div class="label">Subtotal de esta lista</div><div class="amt">${money(sub)}</div></div>
      <button class="btn btn-primary" data-nav="carrito">Ir al carrito →</button>
    </div>
  </section>`;
}

function splitControlHtml(uniIdx, u){
  // control para repartir las unidades de una pieza de uniforme entre los alumnos del pedido
  if(state.students.length < 2) return '';
  const total = uniformAssignTotal(u);
  const faltan = u.qty - total;
  const manual = state.students.length > 2;
  return `
    <div style="margin-top:6px; padding:8px 10px; background:var(--navy-tint); border-radius:4px;">
      <div style="font-size:0.74rem; color:var(--ink-soft); margin-bottom:4px;">Repartir entre:</div>
      ${state.students.map(s => {
        const val = (u.assign||{})[s.id] || 0;
        return `<div class="split-row">
          <span class="nombre">${esc(s.nombres)}</span>
          <div class="stepper ${faltan!==0?'unbalanced':''}">
            <button type="button" data-split-dec="${uniIdx}|${esc(s.id)}">−</button>
            <span style="width:32px; display:inline-block; text-align:center;">${val}</span>
            <button type="button" data-split-inc="${uniIdx}|${esc(s.id)}">+</button>
          </div>
        </div>`;
      }).join('')}
      ${faltan!==0 ? `<div class="split-warning">${faltan>0 ? 'Falta asignar '+faltan : 'Sobran '+(-faltan)+' por asignar'}</div>` : ''}
    </div>`;
}

function cartView(){
  const gradeKeys = gradosActivosEnCarrito();
  const hasUniforms = state.uniformCart.length > 0;
  if(!gradeKeys.length && !hasUniforms){
    return `
    <section class="view empty-state">
      <div class="big">🛒</div>
      <h2>Tu carrito está vacío</h2>
      <p>Elige una lista de útiles o algún uniforme para empezar.</p>
      <button class="btn btn-primary" data-nav="utiles" style="margin-top:12px">Ver listas de útiles</button>
    </section>`;
  }

  const alumnos = alumnosActivosEnCarrito();
  const splitYaMostrado = new Set();

  let bloques = '';
  alumnos.forEach(al => {
    let rows = '';
    gradeKeys.filter(g => state.gradeAssign[g]===al.id).forEach(g => {
      GRADES[gradeNameOf(g)].items.forEach((it,i) => {
        const qty = state.gradeQtys[g][i]||0;
        if(!qty) return;
        rows += `<tr>
          <td>${esc(it.descripcion)}</td>
          <td class="num">${qty}</td>
          <td class="num">${money(it.precio_unitario)}</td>
          <td class="num">${money(qty*it.precio_unitario)}</td>
        </tr>`;
      });
      rows += `<tr><td colspan="4" style="text-align:right;"><button class="btn-ghost" data-nav="utiles" data-open-grade="${esc(g)}">editar esta lista</button></td></tr>`;
    });
    state.uniformCart.forEach((u,idx) => {
      const units = (u.assign||{})[al.id] || 0;
      if(units<=0) return;
      const info = UNIFORMS.find(x=>x.id===u.id);
      const mostrarSplit = !splitYaMostrado.has(idx);
      if(mostrarSplit) splitYaMostrado.add(idx);
      rows += `<tr>
        <td>${esc(info.name)} · talla ${esc(u.size)}${state.students.length>1 && u.qty>1 ? ' <span style="color:var(--ink-soft); font-size:0.78rem;">('+units+' de '+u.qty+')</span>' : ''}${mostrarSplit ? splitControlHtml(idx,u) : ''}</td>
        <td class="num">${units}</td>
        <td class="num">${money(info.price)}</td>
        <td class="num">${money(info.price*units)} <button class="btn-ghost" data-remove-uni="${idx}">quitar</button></td>
      </tr>`;
    });
    if(!rows) return;
    bloques += `<tr><td class="cart-group-title" colspan="4">👤 ${esc(nombreCompleto(al))}${al.grado ? ' · '+esc(al.grado.replace(' PRIMARIA','').trim())+' de primaria' : ''} <span style="float:right; font-weight:400;">${money(subtotalAlumno(al.id))}</span></td></tr>${rows}`;
  });

  const faltaRepartir = !carritoRepartidoCompleto();

  return `
  <section class="view">
    <h2 style="margin-top:0">Tu carrito</h2>
    ${state.students.length ? `
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center;">
        ${state.students.map(al => `<span class="alumno-chip">👤 ${esc(nombreCompleto(al))}${subtotalAlumno(al.id)<=0?' (sin artículos aún)':''}</span>`).join('')}
        <button class="btn btn-secondary btn-sm" id="addStudentBtn">+ Agregar otro alumno(a)</button>
      </div>
    ` : ''}
    ${faltaRepartir ? `
      <div class="note-box error" style="margin-bottom:14px;">
        Todavía falta repartir alguna cantidad de uniforme entre los alumnos. Revisa los avisos en rojo abajo.
      </div>
    ` : ''}
    <table class="cart-table">
      <thead><tr><th>Artículo</th><th class="num">Cant.</th><th class="num">P. unit.</th><th class="num">Importe</th></tr></thead>
      <tbody>${bloques}</tbody>
    </table>
    <div class="totals-block">
      <div class="row grand"><span>Total</span><span>${money(cartSubtotal())}</span></div>
    </div>
    <div class="summary-bar">
      <div class="tot"><div class="label">Total del carrito</div><div class="amt">${money(cartSubtotal())}</div></div>
      <button class="btn btn-primary" data-nav="datos" ${faltaRepartir?'disabled':''}>Continuar con tus datos →</button>
    </div>
  </section>`;
}

/* ================= ALUMNOS / HERMANOS ================= */

function newStudentId(){
  return 'al_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function studentById(id){
  return state.students.find(s=>s.id===id) || null;
}
function uniformAssignTotal(u){
  return Object.values(u.assign||{}).reduce((a,b)=>a+(b||0),0);
}
// ¿hay algo en el carrito (lista de útiles con subtotal>0, o uniforme) sin asignar a un alumno?
function siguienteAsignacionPendiente(){
  for(const g of Object.keys(state.gradeQtys)){
    if(gradeSubtotal(g) > 0 && !state.gradeAssign[g]) return { kind:'grade', grade:g };
  }
  for(let i=0;i<state.uniformCart.length;i++){
    const u = state.uniformCart[i];
    if(uniformAssignTotal(u) < u.qty) return { kind:'uniform', uniIndex:i };
  }
  return null;
}
function abrirSiguienteAsignacionSiHaceFalta(){
  if(state.pendingAssign) return;
  const next = siguienteAsignacionPendiente();
  if(!next) return;
  const step = state.students.length===0 ? 'nuevo' : (state.students.length===1 ? 'mismo' : 'elegir');
  state.pendingAssign = Object.assign(next, { step, nuevo:{ nombres:'', apellidoPaterno:'', apellidoMaterno:'', grado: next.kind==='grade' ? gradeNameOf(next.grade) : '' } });
}
function etiquetaAsignacionPendiente(){
  const p = state.pendingAssign;
  if(!p) return '';
  if(p.kind==='grade'){
    return 'la lista de ' + gradeNameOf(p.grade).replace(' PRIMARIA','').trim() + ' de primaria';
  }
  if(p.kind==='uniform'){
    const u = state.uniformCart[p.uniIndex];
    if(!u) return '';
    const info = UNIFORMS.find(x=>x.id===u.id);
    return u.qty + ' × ' + (info?info.name:u.id) + ', talla ' + u.size;
  }
  return '';
}
function asignarPendienteA(studentId){
  const p = state.pendingAssign;
  if(!p) return;
  if(p.kind==='grade'){
    state.gradeAssign[p.grade] = studentId;
  } else if(p.kind==='uniform'){
    const u = state.uniformCart[p.uniIndex];
    if(u){
      if(!u.assign) u.assign = {};
      const falta = u.qty - uniformAssignTotal(u);
      u.assign[studentId] = (u.assign[studentId]||0) + falta;
    }
  }
  // kind 'manual' (agregar otro alumno desde el carrito): no hay nada que asignar, solo se registró el alumno.
  state.pendingAssign = null;
  abrirSiguienteAsignacionSiHaceFalta();
  render();
}
function cancelarPendiente(){
  const p = state.pendingAssign;
  if(p){
    if(p.kind==='grade') delete state.gradeQtys[p.grade];
    else if(p.kind==='uniform'){
      const u = state.uniformCart[p.uniIndex];
      if(u){
        const asignado = uniformAssignTotal(u);
        if(asignado<=0) state.uniformCart.splice(p.uniIndex,1);
        else u.qty = asignado; // descarta solo las unidades nuevas que no se habían repartido
      }
    }
  }
  state.pendingAssign = null;
  abrirSiguienteAsignacionSiHaceFalta();
  render();
}
// alumnos que ya tienen algo asignado en el carrito actual (para mostrarlos agrupados)
function alumnosActivosEnCarrito(){
  const ids = new Set();
  Object.values(state.gradeAssign).forEach(id => { if(id) ids.add(id); });
  state.uniformCart.forEach(u => Object.keys(u.assign||{}).forEach(id => { if((u.assign[id]||0)>0) ids.add(id); }));
  return state.students.filter(s=>ids.has(s.id));
}
function subtotalAlumno(studentId){
  let sum = 0;
  Object.keys(state.gradeAssign).forEach(g => { if(state.gradeAssign[g]===studentId) sum += gradeSubtotal(g); });
  state.uniformCart.forEach(u => {
    const units = (u.assign||{})[studentId] || 0;
    if(units>0){ const info = UNIFORMS.find(x=>x.id===u.id); sum += info.price * units; }
  });
  return sum;
}
// une los nombres de los alumnos de un pedido ya guardado, con compatibilidad para pedidos viejos sin "alumnos"
function alumnosLabel(order){
  const al = (order.alumnos && order.alumnos.length) ? order.alumnos : (order.cliente && order.cliente.nombres ? [order.cliente] : []);
  return al.map(nombreCompleto).filter(Boolean).join(' y ') || '—';
}
function gradosLabel(order){
  const al = (order.alumnos && order.alumnos.length) ? order.alumnos : (order.cliente && order.cliente.grado ? [order.cliente] : []);
  const grados = al.map(a => (a.grado||'').replace(' PRIMARIA','').trim()).filter(Boolean);
  return [...new Set(grados)].join(', ');
}
// ¿todas las piezas de uniforme con varios alumnos quedaron completamente repartidas?
function carritoRepartidoCompleto(){
  if(siguienteAsignacionPendiente()) return false;
  return state.uniformCart.every(u => uniformAssignTotal(u) === u.qty);
}
// mueve 1 unidad de una pieza de uniforme hacia/desde un alumno. Con 2 alumnos se balancea solo;
// con 3 o más, cada +/- es independiente (y el carrito marca en rojo si no suman la cantidad total).
function ajustarReparto(uniIdx, studentId, delta){
  const u = state.uniformCart[uniIdx];
  if(!u) return;
  if(!u.assign) u.assign = {};
  const ids = state.students.map(s=>s.id);
  if(ids.length === 2){
    const otherId = ids.find(id=>id!==studentId);
    const cur = u.assign[studentId]||0, otherCur = u.assign[otherId]||0;
    const next = cur + delta, otherNext = otherCur - delta;
    if(next < 0 || next > u.qty || otherNext < 0 || otherNext > u.qty) return;
    u.assign[studentId] = next;
    u.assign[otherId] = otherNext;
  } else {
    const cur = u.assign[studentId]||0;
    const sumOtros = Object.keys(u.assign).reduce((s,id) => id===studentId ? s : s+(u.assign[id]||0), 0);
    let next = cur + delta;
    if(next < 0) next = 0;
    if(next + sumOtros > u.qty) next = u.qty - sumOtros;
    u.assign[studentId] = next;
  }
  render();
}

function exportCortesExcel(){
  if(typeof XLSX === 'undefined'){ alert('No se pudo cargar el generador de Excel. Revisa tu conexión.'); return; }
  const filas = cortesRows();
  // columnas din\u00e1micas: una por cada tipo de uniforme que aparezca (para capturarlo igual que en Innovat, pieza por pieza)
  const tiposUniforme = [];
  filas.forEach(o => { Object.keys(orderTotals(o).uniformesDetalle||{}).forEach(n => { if(!tiposUniforme.includes(n)) tiposUniforme.push(n); }); });
  const header = ['Folio','Fecha','Alumno','Grado','Método de pago','Pago confirmado','Papelería','Libros', ...tiposUniforme, 'Envío','Total','Capturado en Innovat'];
  const rows = [header];
  filas.forEach(o => {
    const t = orderTotals(o);
    const uniCols = tiposUniforme.map(n => (t.uniformesDetalle||{})[n] || 0);
    rows.push([o.folio, new Date(o.createdAt).toLocaleDateString('es-MX'), alumnosLabel(o), gradosLabel(o),
      o.payment==='transferencia' ? 'Transferencia' : 'Efectivo', o.pagoConfirmado ? 'Sí' : 'No',
      t.papeleria, t.libros, ...uniCols, o.deliveryFee||0, o.total||0, o.capturadoInnovat ? 'Sí' : 'No']);
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = header.map(h => ({ wch: Math.max(10, Math.min(28, h.length+2)) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Corte');
  XLSX.writeFile(wb, 'Corte_Innovat_' + new Date().toISOString().slice(0,10) + '.xlsx');
}

function ventasView(){
  const pagados = state.orders.filter(o => o.pagoConfirmado);
  const totalIngresos = pagados.reduce((s,o) => s + (o.total||0), 0);
  const sum = { papeleria:0, libros:0, uniformes:0 };
  const porMetodo = { transferencia: 0, efectivo: 0 };
  const porArticulo = {};
  pagados.forEach(o => {
    const t = orderTotals(o);
    sum.papeleria += t.papeleria; sum.libros += t.libros; sum.uniformes += uniformesTotalOrden(o);
    porMetodo[o.payment] = (porMetodo[o.payment]||0) + (o.total||0);
    o.items.utiles.forEach(it => {
      const k = it.descripcion;
      porArticulo[k] = porArticulo[k] || { cant:0, monto:0 };
      porArticulo[k].cant += it.qty; porArticulo[k].monto += it.qty*it.precio_unitario;
    });
    o.items.uniformes.forEach(u => {
      const k = u.name + ' (talla ' + u.size + ')';
      porArticulo[k] = porArticulo[k] || { cant:0, monto:0 };
      porArticulo[k].cant += u.qty; porArticulo[k].monto += u.qty*u.price;
    });
  });
  const topArticulos = Object.entries(porArticulo).sort((a,b) => b[1].cant - a[1].cant).slice(0, 15);

  return `
  <div class="pay-detail">
    <h3 style="margin-top:0;">Resumen de ventas (pagos confirmados)</h3>
    <div class="rline"><span>Pedidos pagados:</span><span><b>${pagados.length}</b> de ${state.orders.length} totales</span></div>

    <hr>
    <div class="rline"><span>Papelería:</span><span>${money(sum.papeleria)}</span></div>
    <div class="rline"><span>Libros:</span><span>${money(sum.libros)}</span></div>
    <div class="rline"><span>Uniformes:</span><span>${money(sum.uniformes)}</span></div>
    <hr>
    <div class="rline"><span>Por transferencia:</span><span>${money(porMetodo.transferencia||0)}</span></div>
    <div class="rline"><span>Por efectivo:</span><span>${money(porMetodo.efectivo||0)}</span></div>
  </div>
  <div class="pay-detail">
    <h3 style="margin-top:0;">Artículos más vendidos</h3>
    ${topArticulos.length ? `<table class="cart-table"><thead><tr><th>Artículo</th><th class="num">Cantidad</th><th class="num">Monto</th></tr></thead><tbody>
      ${topArticulos.map(([nombre,d]) => `<tr><td>${esc(nombre)}</td><td class="num">${d.cant}</td><td class="num">${money(d.monto)}</td></tr>`).join('')}

  <p style="font-size:0.78rem; color:var(--ink-soft);">Este resumen solo cuenta pedidos cuyo pago ya marcaste como confirmado, para que refleje dinero real recibido.</p>`;

function checklistHtml(order){
  const checklist = order.checklist || {};

  let rows = ''; let total = 0, checked = 0;
  order.items.utiles.forEach((it,i) => {
    const key = 'u'+i; total++; if(checklist[key]) checked++;
    const quien = multi ? ' — ' + esc(nombreAlumnoPorId(order, it.studentId)) : '';
    rows += `<label class="item-row" style="cursor:${terminado?'default':'pointer'};">

    </label>`;
  });
  order.items.uniformes.forEach((u,i) => {
    const key = 'f'+i; total++; if(checklist[key]) checked++;
    const reparto = multi && u.splits && u.splits.length ? ' — ' + u.splits.map(s=>esc(nombreAlumnoPorId(order,s.studentId))+': '+s.qty).join(', ') : '';

  });
  return `<div class="section-block">

}

function wireEvents(){
  // diálogo de asignación de alumno (hermanos)
  if(state.pendingAssign){
    document.querySelectorAll('[data-assign-pick]').forEach(el => el.addEventListener('click', () => {
      asignarPendienteA(el.getAttribute('data-assign-pick'));
    }));
    const otherBtn = document.querySelector('[data-assign-other]');
    if(otherBtn) otherBtn.addEventListener('click', () => {
      state.pendingAssign.step = 'nuevo';
      if(!state.pendingAssign.nuevo) state.pendingAssign.nuevo = { nombres:'', apellidoPaterno:'', apellidoMaterno:'', grado:'' };
      render();
    });
    const cancelBtn = document.querySelector('[data-assign-cancel]');
    if(cancelBtn) cancelBtn.addEventListener('click', () => cancelarPendiente());
    ['panNombres','panApPaterno','panApMaterno'].forEach((id,idx) => {
      const field = ['nombres','apellidoPaterno','apellidoMaterno'][idx];
      const el = document.getElementById(id);
      if(el) el.addEventListener('input', () => { state.pendingAssign.nuevo[field] = el.value; render(); });
    });
    const panGrado = document.getElementById('panGrado');
    if(panGrado) panGrado.addEventListener('change', () => { state.pendingAssign.nuevo.grado = panGrado.value; render(); });
    const panGuardar = document.getElementById('panGuardarBtn');
    if(panGuardar) panGuardar.addEventListener('click', () => {
      const n = state.pendingAssign.nuevo;
      if((n.nombres||'').trim().length<2 || (n.apellidoPaterno||'').trim().length<2 || (n.apellidoMaterno||'').trim().length<2) return;

function initSignaturePad(){
  const canvas = document.getElementById('sigCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#23304a';
  let drawing = false, last = null, hasDrawn = false;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
    return { x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY };
  }
  function updateConfirmBtn(){
    const cdBtn = document.getElementById('confirmDeliveryBtn');
    const nameInput = document.getElementById('recibioNombreInput');
    if(!cdBtn) return;
    const nameOk = nameInput && nameInput.value.trim().length > 1;
    if(hasDrawn && nameOk) cdBtn.removeAttribute('disabled'); else cdBtn.setAttribute('disabled','disabled');
  }
  canvas.onpointerdown = (e) => { drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); };
  canvas.onpointermove = (e) => {
    if(!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last = p; hasDrawn = true; updateConfirmBtn();
  };
  canvas.onpointerup = () => { drawing = false; };
  canvas.onpointerleave = () => { drawing = false; };

  const nameInput = document.getElementById('recibioNombreInput');
  if(nameInput) nameInput.addEventListener('input', updateConfirmBtn);
  const clearSigBtn = document.getElementById('clearSigBtn');
  if(clearSigBtn) clearSigBtn.onclick = () => { ctx.clearRect(0,0,canvas.width,canvas.height); hasDrawn = false; updateConfirmBtn(); };
}

let scannerStream = null;
let scannerRAF = null;

function stopScanner(){
  if(scannerRAF) cancelAnimationFrame(scannerRAF);
  scannerRAF = null;
  if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream = null; }
}

function tryOpenFolio(folio){
  if(!folio) return;
  const order = state.orders.find(o => o.folio.toLowerCase() === folio.toLowerCase());
  if(order){
    stopScanner();
    state.scannerOpen = false;
    state.scannerError = null;
    state.adminOrderFolio = order.folio;
  } else {
    state.scannerError = 'No se encontró un pedido con ese folio.';
  }
  render();
}

function startScanner(){
  const video = document.getElementById('scanVideo');
  if(!video || scannerStream) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    state.scannerError = 'Este navegador no permite acceder a la cámara aquí. Usa la búsqueda manual del folio.';
    render();
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(stream => {
    scannerStream = stream;
    video.srcObject = stream;
    const canvas = document.getElementById('scanCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    function tick(){
      if(!scannerStream) return;
      if(video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        try{
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts:'dontInvert' });
          if(code && code.data){ tryOpenFolio(code.data.trim()); return; }
        }catch(e){ /* frame ignorado */ }
      }
      scannerRAF = requestAnimationFrame(tick);
    }
    scannerRAF = requestAnimationFrame(tick);
  }).catch(err => {
    state.scannerError = 'No se pudo acceder a la cámara (' + (err && err.name ? err.name : 'permiso denegado') + '). Usa la búsqueda manual del folio.';
    render();
  });
}

async function boot(){
  const appEl = document.getElementById('app');
  appEl.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Nunito',sans-serif;color:#5b6785;">Cargando la tienda…</div>`;
  try{
    await Promise.all([loadListas(), loadInventario()]);
  }catch(err){
    console.error(err);
    appEl.innerHTML = `<div style="padding:40px;text-align:center;color:#b8433a;font-family:'Nunito',sans-serif;">No se pudo conectar con la base de datos. Revisa tu conexión a internet y recarga la página.</div>`;
    return;
  }
  render();
}
document.addEventListener('DOMContentLoaded', boot);
</script>
