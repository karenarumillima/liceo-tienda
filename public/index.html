// lista de útiles: paquetes y cantidades
function eventosListaUtiles(){
  // presets de lista
  document.querySelectorAll('[data-preset]').forEach(el => el.addEventListener('click', () => {
    const g = el.getAttribute('data-grade');
    const preset = el.getAttribute('data-preset');
    const qtys = ensureGradeQtys(g);
    GRADES[gradeNameOf(g)].items.forEach((it,i) => {
      if(!utilDisponible(gradeNameOf(g), i)){ qtys[i] = 0; return; }
      if(preset==='completo') qtys[i] = it.cantidad;
      else if(preset==='libros') qtys[i] = it.seccion==='LIBROS' ? it.cantidad : 0;
      else if(preset==='diario') qtys[i] = it.seccion!=='LIBROS' ? it.cantidad : 0;
      else if(preset==='ninguno') qtys[i] = 0;
    });
    render();
  }));

  // cantidades por artículo
  document.querySelectorAll('[data-qty-input]').forEach(el => {
    el.addEventListener('input', () => {
      const g = el.getAttribute('data-grade'), i = el.getAttribute('data-qty-input');
      const q = utilDisponible(gradeNameOf(g), i) ? Math.max(0, parseInt(el.value)||0) : 0;
      ensureGradeQtys(g)[i] = q;
      const fila = el.closest('.item-row');
      if(fila){
        fila.classList.toggle('unselected', q === 0);
        const amt = fila.querySelector('.amt'); if(amt) amt.textContent = money(q * GRADES[gradeNameOf(g)].items[i].precio_unitario);
      }
      const sub = document.querySelector('.summary-bar .amt'); if(sub) sub.textContent = money(gradeSubtotal(g));
    });
    el.addEventListener('change', () => render());   // al salir del campo se actualiza carrito y totales
  });
  document.querySelectorAll('[data-qty-inc]').forEach(el => el.addEventListener('click', () => {
    const g = el.getAttribute('data-grade'), i = el.getAttribute('data-qty-inc');
    if(!utilDisponible(gradeNameOf(g), i)) return;
    const qtys = ensureGradeQtys(g); qtys[i] = (qtys[i]||0)+1; render();
  }));
  document.querySelectorAll('[data-qty-dec]').forEach(el => el.addEventListener('click', () => {
    const g = el.getAttribute('data-grade'), i = el.getAttribute('data-qty-dec');
    const qtys = ensureGradeQtys(g); qtys[i] = Math.max(0,(qtys[i]||0)-1); render();
  }));

  document.querySelectorAll('[data-toggle-section]').forEach(el => el.addEventListener('click', () => {
    const sec = el.getAttribute('data-toggle-section'), g = el.getAttribute('data-grade');
    const qtys = ensureGradeQtys(g);
    const items = GRADES[gradeNameOf(g)].items;
    const idxs = items.map((it,i)=>it.seccion===sec && utilDisponible(gradeNameOf(g), i)?i:null).filter(i=>i!==null);
    const allOn = idxs.every(i => qtys[i]>0);
    idxs.forEach(i => qtys[i] = allOn ? 0 : items[i].cantidad);
    render();
  }));
}

// uniformes: tallas, carrito, galería y 'avísame'
function eventosUniformes(){
  // uniformes
  document.querySelectorAll('[data-uni-inc]').forEach(el => el.addEventListener('click', () => {
    const input = document.querySelector(`[data-uni-qty="${el.getAttribute('data-uni-inc')}"]`);
    input.value = Math.max(1, (parseInt(input.value)||1) + 1);
  }));
  document.querySelectorAll('[data-uni-dec]').forEach(el => el.addEventListener('click', () => {
    const input = document.querySelector(`[data-uni-qty="${el.getAttribute('data-uni-dec')}"]`);
    input.value = Math.max(1, (parseInt(input.value)||1) - 1);
  }));
  document.querySelectorAll('[data-uni-size]').forEach(el => el.addEventListener('change', () => {
    state.uniSel[el.getAttribute('data-uni-size')] = el.value;
    render();
  }));
  document.querySelectorAll('[data-uni-add]').forEach(el => el.addEventListener('click', () => {
    const id = el.getAttribute('data-uni-add');
    const size = uniTallaSel(id);
    const existing = state.uniformCart.find(u => u.id===id && u.size===size);
    const disponibles = stockDe(id+'_'+size) - (existing ? existing.qty : 0);
    if(disponibles <= 0){ alert(`Ya tienes en tu carrito todas las piezas disponibles de talla ${size}.`); return; }
    let qty = Math.max(1, parseInt(document.querySelector(`[data-uni-qty="${id}"]`).value)||1);
    if(qty > disponibles){ alert(`Solo hay ${disponibles} disponible${disponibles===1?'':'s'} en talla ${size}; se agregó esa cantidad.`); qty = disponibles; }
    if(existing) existing.qty += qty; else state.uniformCart.push({id, size, qty});
    setTab('carrito');
  }));

  // galería de fotos de uniformes
  document.querySelectorAll('[data-uni-thumb]').forEach(el => el.addEventListener('click', () => {
    state.uniFotoIdx[el.getAttribute('data-uni-thumb')] = +el.getAttribute('data-idx'); render();
  }));
  document.querySelectorAll('[data-lightbox]').forEach(el => el.addEventListener('click', () => {
    state.lightbox = { uniId: el.getAttribute('data-lightbox'), idx: +el.getAttribute('data-idx') }; render();
  }));
  const lightbox = document.getElementById('lightbox');
  if(lightbox){
    const mover = (d) => { const n = uniInfo(state.lightbox.uniId).fotos.length; state.lightbox.idx = (state.lightbox.idx + d + n) % n; render(); };
    lightbox.addEventListener('click', (e) => {
      const accion = e.target.closest('[data-lb]') ? e.target.closest('[data-lb]').getAttribute('data-lb') : (e.target === lightbox ? 'cerrar' : null);
      if(accion === 'cerrar'){ state.lightbox = null; render(); }
      else if(accion === 'prev') mover(-1);
      else if(accion === 'next') mover(1);
    });
  }

  // "avísame cuando haya" (uniformes agotados)
  document.querySelectorAll('[data-aviso-abrir]').forEach(el => el.addEventListener('click', () => {
    const uniId = el.getAttribute('data-aviso-abrir');
    state.avisoForm = { uniId, size: uniTallaSel(uniId), telefono: state.cliente.telefono||'', correo: state.cliente.correo||'', saving:false, error:'', enviado:false };
    render();
  }));
  [['avisoTel','telefono'],['avisoCorreo','correo']].forEach(([id,field]) => {
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', () => {
      state.avisoForm[field] = el.value; state.avisoForm.error = '';
      const f = state.avisoForm;
      habilitar('#avisoGuardarBtn', telValido(f.telefono) && correoValido(f.correo) && !f.saving);
    });
  });
  const avisoCancelarBtn = document.getElementById('avisoCancelarBtn');
  if(avisoCancelarBtn) avisoCancelarBtn.addEventListener('click', () => { state.avisoForm = null; render(); });
  const avisoGuardarBtn = document.getElementById('avisoGuardarBtn');
  if(avisoGuardarBtn) avisoGuardarBtn.addEventListener('click', async () => {
    const f = state.avisoForm;
    const info = uniInfo(f.uniId);
    f.saving = true; render();
    try{
      await setDoc(doc(collection(db, 'avisos')), {
        uniformeId: f.uniId, nombre: info.name, talla: f.size,
        telefono: f.telefono.replace(/\D/g,''), correo: f.correo.trim(),
        estado: 'pendiente', createdAt: new Date().toISOString(),
      });
      f.enviado = true;
    }catch(err){
      console.error(err);
      f.error = 'No se pudo registrar tu aviso. Intenta de nuevo.';
    }
    f.saving = false; render();
  });
  document.querySelectorAll('[data-remove-uni]').forEach(el => el.addEventListener('click', () => {
    state.uniformCart.splice(parseInt(el.getAttribute('data-remove-uni')), 1);
    render();
  }));
}

// rastrear pedido
function eventosRastreo(){
  // rastrear pedido (cliente)
  const tFolio = document.getElementById('tFolio'), tTel = document.getElementById('tTel');
  if(tFolio) tFolio.addEventListener('input', () => { state.track.folio = tFolio.value; });
  if(tTel) tTel.addEventListener('input', () => { state.track.tel = tTel.value; });
  const trackBtn = document.getElementById('trackBtn');
  if(trackBtn) trackBtn.addEventListener('click', async () => {
    const folio = state.track.folio.trim().toUpperCase();
    const tel = state.track.tel.replace(/\D/g,'');
    state.track.order = null; state.track.error = '';
    if(!folio || tel.length !== 10){ state.track.error = 'Escribe tu folio y tu teléfono de 10 dígitos.'; render(); return; }
    state.track.loading = true; render();
    try{
      const snap = await getDoc(doc(db, 'pedidos', folio));
      if(!snap.exists() || String((snap.data().cliente||{}).telefono||'').replace(/\D/g,'') !== tel){
        state.track.error = 'No encontramos un pedido con ese folio y teléfono. Revisa los datos.';
      } else { state.track.order = snap.data(); }
    }catch(err){ console.error(err); state.track.error = 'No se pudo consultar el pedido en este momento. Intenta de nuevo.'; }
    state.track.loading = false; render();
  });

  document.querySelectorAll('[data-track-mode]').forEach(el => el.addEventListener('click', () => {
    state.track.mode = el.getAttribute('data-track-mode');
    state.track.error = ''; state.track.order = null;
    render();
  }));
  const tNombres = document.getElementById('tNombres'), tApPaterno = document.getElementById('tApPaterno'),
        tApMaterno = document.getElementById('tApMaterno'), tTel2 = document.getElementById('tTel2');
  if(tNombres) tNombres.addEventListener('input', () => { state.track.nombres = tNombres.value; });
  if(tApPaterno) tApPaterno.addEventListener('input', () => { state.track.apPaterno = tApPaterno.value; });
  if(tApMaterno) tApMaterno.addEventListener('input', () => { state.track.apMaterno = tApMaterno.value; });
  if(tTel2) tTel2.addEventListener('input', () => { state.track.tel = tTel2.value; });
  const trackBtnNombre = document.getElementById('trackBtnNombre');
  if(trackBtnNombre) trackBtnNombre.addEventListener('click', async () => {
    const t = state.track;
    const tel = t.tel.replace(/\D/g,'');
    t.order = null; t.error = '';
    if(!t.nombres.trim() || !t.apPaterno.trim() || !t.apMaterno.trim() || tel.length !== 10){
      t.error = 'Escribe nombre(s), ambos apellidos, y el teléfono de 10 dígitos.'; render(); return;
    }
    t.loading = true; render();
    try{
      const key = slug([t.nombres, t.apPaterno, t.apMaterno].join(' ')) + '_' + tel;
      const puntero = await getDoc(doc(db, 'busquedas', key));
      if(!puntero.exists()){
        t.error = 'No encontramos un pedido con ese nombre y teléfono exactos. Revisa que estén escritos igual que al hacer el pedido.';
      } else {
        const snap = await getDoc(doc(db, 'pedidos', puntero.data().folio));
        if(!snap.exists()) t.error = 'No encontramos ese pedido. Contacta al Liceo.';
        else t.order = snap.data();
      }
    }catch(err){ console.error(err); t.error = 'No se pudo consultar el pedido en este momento. Intenta de nuevo.'; }
    t.loading = false; render();
  });
}

// pago y comprobante
function eventosPago(){
  // pago
  document.querySelectorAll('[data-payment]').forEach(el => el.addEventListener('click', () => {
    state.payment = el.getAttribute('data-payment'); render();
  }));
  const comprobanteInput = document.getElementById('comprobanteInput');
  if(comprobanteInput) comprobanteInput.addEventListener('change', () => {
    const file = comprobanteInput.files[0];
    if(!file) return;
    state.comprobanteFile = file;
    const total = grandTotal();
    const reader = new FileReader();
    reader.onload = () => { state.comprobante = reader.result; render(); };
    reader.readAsDataURL(file);
    state.comprobanteRevision = { estado: 'revisando' };
    render();
    revisarComprobante(file, total).then(r => {
      if(state.comprobanteFile !== file) return;   // ya subió otra imagen
      state.comprobanteRevision = { estado: r.ok ? 'ok' : 'rechazado', montoOk: r.montoOk, palabras: r.palabras,
        claveRastreo: r.claveRastreo, huellas: r.huellas, duplicado: r.duplicado };
      render();
    }).catch(err => {
      console.error(err);
      if(state.comprobanteFile !== file) return;
      state.comprobanteRevision = { estado: 'fallo', montoOk: false, palabras: [] };
      render();
    });
  });
  const confirmBtn = document.getElementById('confirmOrderBtn');
  if(confirmBtn) confirmBtn.addEventListener('click', async () => {
    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Guardando pedido...';
    try{
      const order = await buildOrder();
      avisarStaffPedidoNuevo(order);
      state.currentFolio = order.folio;
      setTab('confirmacion');
    }catch(err){
      console.error(err);
      if(err && err.message === 'comprobante-duplicado'){
        state.comprobanteRevision = Object.assign({}, state.comprobanteRevision, { estado: 'rechazado', duplicado: true });
        render();
        alert('Este comprobante ya se usó en otro pedido. Sube el comprobante de la transferencia de este pedido.');
        return;
      }
      alert('Hubo un problema al guardar tu pedido. Intenta de nuevo. Si el problema sigue, avisa al local.');
      confirmBtn.disabled = false;
      confirmBtn.textContent = 'Confirmar pedido →';
    }
  });
}

// panel: catálogo de uniformes
function eventosUniformesAdmin(){
  // catálogo de uniformes (admin)
  document.querySelectorAll('[data-uni-edit]').forEach(el => {
    const evento = el.type === 'checkbox' ? 'change' : 'input';
    el.addEventListener(evento, () => {
      const id = el.getAttribute('data-uni-edit'), campo = el.getAttribute('data-campo');
      state.uniDraft[id] = Object.assign(state.uniDraft[id]||{}, { [campo]: el.type === 'checkbox' ? el.checked : el.value });
    });
  });
  document.querySelectorAll('[data-uni-guardar]').forEach(el => el.addEventListener('click', async () => {
    const id = el.getAttribute('data-uni-guardar');
    const u = uniInfo(id);
    const d = uniDraftDe(u);
    const precio = String(d.price).trim() === '' ? null : Number(String(d.price).replace(/[$,\s]/g,''));
    if(precio !== null && !(precio > 0)){ alert('El precio debe ser un número mayor a 0, o déjalo vacío si aún no está definido.'); return; }
    const tallas = [...new Set(String(d.tallas).split(',').map(t => t.trim()).filter(Boolean))];
    if(!tallas.length){ alert('Pon al menos una talla.'); return; }
    if(!d.name.trim()){ alert('Pon el nombre de la prenda.'); return; }
    const datos = { name: d.name.trim(), price: precio, tallas, activo: !!d.activo, foto: u.fotos[0] || '', fotos: u.fotos, orden: u.orden ?? 999 };
    state.uniGuardando = id; render();
    try{
      await setDoc(doc(db, 'uniformes', id), datos, { merge: true });
      Object.assign(u, datos);
      delete state.uniDraft[id];
    }catch(err){ console.error(err); alert('No se pudo guardar la prenda.'); }
    state.uniGuardando = null; render();
  }));
  document.querySelectorAll('[data-uni-foto]').forEach(el => el.addEventListener('change', async () => {
    const id = el.getAttribute('data-uni-foto');
    const file = el.files && el.files[0];
    if(!file) return;
    if(file.size > 5*1024*1024){ alert('La foto pesa más de 5 MB. Usa una más ligera.'); return; }
    state.uniGuardando = id; render();
    try{
      const sref = storageRef(storage, `productos/${id}-${Date.now()}.jpg`);
      await uploadBytes(sref, file, { contentType: file.type || 'image/jpeg' });
      const url = await getDownloadURL(sref);
      const u = uniInfo(id);
      const fotos = [...u.fotos, url];
      await setDoc(doc(db, 'uniformes', id), { foto: fotos[0], fotos }, { merge: true });
      u.fotos = fotos; u.foto = fotos[0];
    }catch(err){ console.error(err); alert('No se pudo subir la foto.'); }
    state.uniGuardando = null; render();
  }));
  document.querySelectorAll('[data-uni-foto-quitar]').forEach(el => el.addEventListener('click', async () => {
    const id = el.getAttribute('data-uni-foto-quitar');
    const u = uniInfo(id);
    const fotos = u.fotos.filter((_, i) => i !== +el.getAttribute('data-idx'));
    if(!confirm('¿Quitar esta foto de la prenda?')) return;
    state.uniGuardando = id; render();
    try{
      await setDoc(doc(db, 'uniformes', id), { foto: fotos[0] || '', fotos }, { merge: true });
      u.fotos = fotos; u.foto = fotos[0] || '';
    }catch(err){ console.error(err); alert('No se pudo quitar la foto.'); }
    state.uniGuardando = null; render();
  }));
  const uniNuevaBtn = document.getElementById('uniNuevaBtn');
  if(uniNuevaBtn) uniNuevaBtn.addEventListener('click', () => {
    const nombre = (prompt('Nombre de la prenda nueva:') || '').trim();
    if(!nombre) return;
    let id = slug(nombre) || ('prenda-' + Date.now());
    if(UNIFORMS.some(u => u.id === id)) id += '-' + Date.now().toString(36);
    UNIFORMS.push(normalizarUniforme({ id, name: nombre, activo: false }, UNIFORMS.length));
    state.uniDraft[id] = { activo: true };
    render();
  });
}

function initSignaturePad(){
  const canvas = document.getElementById('sigCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#23304a';
  let drawing = false, last = null, hasDrawn = false;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
    return { x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY };
  }
  function updateConfirmBtn(){
    const cdBtn = document.getElementById('confirmDeliveryBtn');
    const nameInput = document.getElementById('recibioNombreInput');
    if(!cdBtn) return;
    const nameOk = nameInput && nameInput.value.trim().length > 1;
    if(hasDrawn && nameOk) cdBtn.removeAttribute('disabled'); else cdBtn.setAttribute('disabled','disabled');
  }
  canvas.onpointerdown = (e) => { drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); };
  canvas.onpointermove = (e) => {
    if(!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last = p; hasDrawn = true; updateConfirmBtn();
  };
  canvas.onpointerup = () => { drawing = false; };
  canvas.onpointerleave = () => { drawing = false; };

  const nameInput = document.getElementById('recibioNombreInput');
  if(nameInput) nameInput.addEventListener('input', updateConfirmBtn);
  const clearSigBtn = document.getElementById('clearSigBtn');
  if(clearSigBtn) clearSigBtn.onclick = () => { ctx.clearRect(0,0,canvas.width,canvas.height); hasDrawn = false; updateConfirmBtn(); };
}

/* ================= ESCÁNER QR ================= */

let scannerStream = null;

let scannerRAF = null;

function stopScanner(){
  if(scannerRAF) cancelAnimationFrame(scannerRAF);
  scannerRAF = null;
  if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream = null; }
}

function tryOpenFolio(folio){
  if(!folio) return;
  const order = state.orders.find(o => o.folio.toLowerCase() === folio.toLowerCase());
  if(order){
    stopScanner();
    state.scannerOpen = false;
    state.scannerError = null;
    state.adminOrderFolio = order.folio;
  } else {
    state.scannerError = 'No se encontró un pedido con ese folio.';
  }
  render();
}

function startScanner(){
  const video = document.getElementById('scanVideo');
  if(!video || scannerStream) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    state.scannerError = 'Este navegador no permite acceder a la cámara aquí. Usa la búsqueda manual del folio.';
    render();
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(stream => {
    scannerStream = stream;
    video.srcObject = stream;
    const canvas = document.getElementById('scanCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    function tick(){
      if(!scannerStream) return;
      if(video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        try{
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts:'dontInvert' });
          if(code && code.data){ tryOpenFolio(code.data.trim()); return; }
        }catch(e){ /* frame ignorado */ }
      }
      scannerRAF = requestAnimationFrame(tick);
    }
    scannerRAF = requestAnimationFrame(tick);
  }).catch(err => {
    state.scannerError = 'No se pudo acceder a la cámara (' + (err && err.name ? err.name : 'permiso denegado') + '). Usa la búsqueda manual del folio.';
    render();
  });
}

/* ================= ARRANQUE ================= */

async function boot(){
  const appEl = document.getElementById('app');
  appEl.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Nunito',sans-serif;color:#5b6785;">Cargando la tienda…</div>`;
  try{
    await Promise.all([loadListas(), loadInventario(), loadUniformes()]);
  }catch(err){
    console.error(err);
    appEl.innerHTML = `<div style="padding:40px;text-align:center;color:#b8433a;font-family:'Nunito',sans-serif;">No se pudo conectar con la base de datos. Revisa tu conexión a internet y recarga la página.</div>`;
    return;
  }
  render();
}

document.addEventListener('keydown', (e) => {
  if(!state.lightbox) return;
  if(e.key === 'Escape'){ state.lightbox = null; render(); }
  else if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
    const n = uniInfo(state.lightbox.uniId).fotos.length;
    state.lightbox.idx = (state.lightbox.idx + (e.key === 'ArrowRight' ? 1 : -1) + n) % n; render();
  }
});

document.addEventListener('DOMContentLoaded', boot);
</script>
