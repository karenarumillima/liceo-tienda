<style>
  :root {
    --paper: #FBF7EE;
    --paper-line: rgba(34, 53, 95, 0.055);
    --ink: #23304a;
    --ink-soft: #5b6785;
    --navy: #22355F;
    --navy-dark: #16233d;
    --navy-tint: #eef1f7;
    --marigold: #E3A430;
    --marigold-dark: #b9821f;
    --red: #b8433a;
    --red-tint: #f8e9e7;
    --green: #3f7d58;
    --green-tint: #e8f2ec;
    --card-bg: #ffffff;
    --border: rgba(34, 53, 95, 0.16);
    --radius: 6px;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #171c28; --paper-line: rgba(255,255,255,0.05); --ink: #eef1f7; --ink-soft: #a6afc7;
      --navy: #6f8ec2; --navy-dark: #3c568a; --navy-tint: #202940;
      --marigold: #eab84c; --marigold-dark: #eab84c; --red: #e07469; --red-tint: #3a2422;
      --green: #6fbd8e; --green-tint: #1d2f26; --card-bg: #1f2434; --border: rgba(255,255,255,0.14);
    }
  }
  :root[data-theme="dark"] {
    --paper: #171c28; --paper-line: rgba(255,255,255,0.05); --ink: #eef1f7; --ink-soft: #a6afc7;
    --navy: #6f8ec2; --navy-dark: #3c568a; --navy-tint: #202940;
    --marigold: #eab84c; --marigold-dark: #eab84c; --red: #e07469; --red-tint: #3a2422;
    --green: #6fbd8e; --green-tint: #1d2f26; --card-bg: #1f2434; --border: rgba(255,255,255,0.14);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; background-color: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, var(--paper-line) 0, var(--paper-line) 1px, transparent 1px, transparent 28px),
      repeating-linear-gradient(90deg, var(--paper-line) 0, var(--paper-line) 1px, transparent 1px, transparent 28px);
    color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; min-height: 100%;
  }
  h1, h2, h3, .display { font-family: var(--font-display); font-weight: 600; color: var(--navy); letter-spacing: -0.01em; }
  a { color: var(--navy); }
  button, input, select { font-family: inherit; }
  input, select { color: var(--ink); background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 4px; padding: 8px 10px; font-size: 0.88rem; }

  .topbar { position: sticky; top: 0; z-index: 40; padding: calc(12px + env(safe-area-inset-top, 0px)) 20px 12px; background: var(--paper); border-bottom: 2px solid var(--navy); display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .brand-mark { width: 46px; height: 38px; flex-shrink: 0; object-fit: contain; display: block; }
  .brand-text { min-width: 0; }
  .brand-text .name { font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; color: var(--navy); line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-text .tag { font-size: 0.74rem; color: var(--ink-soft); }
  .staff-link { background: none; border: none; color: var(--ink-soft); font-weight: 700; font-size: 0.78rem; cursor: pointer; text-decoration: underline; white-space: nowrap; }
  .cart-btn { position: relative; background: var(--marigold); color: var(--navy-dark); border: none; border-radius: 4px; padding: 9px 14px; font-weight: 800; font-size: 0.88rem; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .cart-btn:active { transform: translateY(1px); }
  .cart-count { background: var(--red); color: #fff; border-radius: 50%; min-width: 19px; height: 19px; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; padding: 0 4px; }

  .tabs { display: flex; gap: 4px; padding: 10px 20px 0; overflow-x: auto; max-width: 980px; margin: 0 auto; }
  .tab { border: none; background: transparent; color: var(--ink-soft); font-weight: 700; font-size: 0.86rem; padding: 9px 4px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tab.active { color: var(--navy); border-bottom-color: var(--marigold); }

  main { max-width: 980px; margin: 0 auto; padding: 22px 20px 120px; }

  .steps { display: flex; flex-wrap: wrap; gap: 6px 0; margin-bottom: 22px; font-size: 0.82rem; color: var(--ink-soft); }
  .steps .s { display: flex; align-items: center; gap: 6px; padding-right: 14px; }
  .steps .s.done { color: var(--green); }
  .steps .s.current { color: var(--navy); font-weight: 800; }
  .steps .sep { padding-right: 14px; }

  section.view { animation: fadein .2s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px);} to {opacity:1; transform:none;} }

  .hero { padding: 10px 0 28px; }
  .hero h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); margin: 0 0 8px; max-width: 20ch; }
  .hero p { color: var(--ink-soft); max-width: 52ch; margin: 0; }

  .cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 22px; }
  .cat-card { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 20px; cursor: pointer; text-align: left; }
  .cat-card:hover { border-color: var(--navy); }
  .cat-card .icon { font-size: 1.8rem; margin-bottom: 10px; display: block; }
  .cat-card h3 { margin: 0 0 4px; font-size: 1.15rem; }
  .cat-card p { margin: 0; color: var(--ink-soft); font-size: 0.88rem; }

  .grade-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
  .grade-card { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 4px; padding: 16px 14px 14px; cursor: pointer; text-align: left; position: relative; }
  .grade-card::before { content: ""; position: absolute; top: 0; right: 0; width: 0; height: 0; border-style: solid; border-width: 0 16px 16px 0; border-color: transparent var(--border) transparent transparent; }
  .grade-card:hover { border-color: var(--navy); }
  .grade-card .num { font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; color: var(--navy); line-height: 1; }
  .grade-card .lbl { font-size: 0.78rem; color: var(--ink-soft); margin-top: 4px; }
  .grade-card .price { margin-top: 10px; font-size: 0.82rem; font-weight: 700; }

  .backlink { background: none; border: none; color: var(--navy); font-weight: 700; font-size: 0.86rem; cursor: pointer; padding: 0 0 16px; display: inline-flex; align-items: center; gap: 6px; }

  .preset-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 20px; }

  .section-block { margin-top: 22px; }
  .section-title { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.04em; color: var(--navy); border-bottom: 2px solid var(--border); padding-bottom: 6px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: baseline; }
  .section-title button { background: none; border: none; color: var(--navy); font-weight: 800; font-size: 0.72rem; cursor: pointer; text-decoration: underline; }

  .item-row { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .item-row .info { flex: 1; min-width: 180px; }
  .item-row .desc { font-weight: 700; font-size: 0.93rem; }
  .item-row.unselected .desc { color: var(--ink-soft); }
  .item-row .qty { font-size: 0.8rem; color: var(--ink-soft); }
  .item-row .amt { font-weight: 800; font-size: 0.93rem; white-space: nowrap; min-width: 66px; text-align: right; }

  .stepper { display: flex; align-items: center; border: 1.5px solid var(--border); border-radius: 4px; overflow: hidden; flex-shrink: 0; }
  .stepper button { background: var(--navy-tint); border: none; width: 28px; height: 32px; font-size: 1rem; cursor: pointer; color: var(--navy); }
  .stepper input { border: none; width: 42px; text-align: center; padding: 0; border-radius: 0; }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .uniform-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
  .uniform-card { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .uniform-card .swatch { width: 100%; height: 64px; border-radius: 4px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
  .uniform-card h4 { margin: 0 0 2px; font-size: 0.98rem; }
  .uniform-card .price { color: var(--navy); font-weight: 800; margin-bottom: 10px; }
  .uniform-card .field-row { flex-wrap: wrap; }

/* ================= UTILIDADES ================= */

function money(n){ return '$' + Number(n||0).toLocaleString('es-MX', {minimumFractionDigits:0, maximumFractionDigits:2}); }

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function idSafe(s){ return String(s).replace(/[^a-zA-Z0-9_-]/g, '_'); }

function slug(str){
  return String(str).trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
}

function normTexto(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }

function fmtDate(d){ return new Date(d).toLocaleDateString('es-MX', {weekday:'long', day:'numeric', month:'long'}); }

function addBusinessDays(date, days){
  const d = new Date(date);
  let added = 0;
  while(added < days){
    d.setDate(d.getDate()+1);
    const day = d.getDay();
    if(day !== 0 && day !== 6) added++;
  }
  return d;
}

// "1ro PRIMARIA" → "1ro" / "1ro de primaria"
function gradoCorto(g){ return String(g||'').replace(' PRIMARIA','').trim(); }

function gradoLargo(g){ return gradoCorto(g) + ' de primaria'; }

function telValido(t){ return String(t||'').replace(/\D/g,'').length === 10; }

function correoValido(c){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(c||'').trim()); }

function quienPersonal(){ return (state.auth && state.auth.name) || 'Personal'; }

function haversineKm(a, b){
  const R = 6371, toRad = d => d*Math.PI/180;
  const dLat = toRad(b.lat-a.lat), dLng = toRad(b.lng-a.lng);
  const x = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

// distancia aproximada por calles: línea recta x ROAD_FACTOR, redondeada a 0.1 km
function kmAproximados(a, b){ return Math.round(haversineKm(a, b) * ROAD_FACTOR * 10) / 10; }

async function sha256Corto(datos){
  const buf = await crypto.subtle.digest('SHA-256', typeof datos === 'string' ? new TextEncoder().encode(datos) : datos);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 32);
}

async function loadListas(){
  const snap = await getDocs(collection(db, 'listas'));
  const g = {};
  snap.forEach(d => {
    const data = d.data();
    g[data.nombre] = { docId: d.id, items: data.items, total_libros: data.total_libros, total_paquete: data.total_paquete };
  });
  GRADES = g;
}

async function loadInventario(){
  const snap = await getDocs(collection(db, 'inventario'));
  const inv = {};
  snap.forEach(d => { inv[d.id] = d.data().stock || 0; });
  state.inventory = inv;
}

async function loadUniformes(){
  const porId = {};
  UNIFORMES_BASE.forEach((u,i) => { porId[u.id] = normalizarUniforme(u, i); });
  try{
    const snap = await getDocs(collection(db, 'uniformes'));
    snap.forEach(d => { porId[d.id] = normalizarUniforme(Object.assign({}, porId[d.id]||{}, d.data(), { id:d.id }), 999); });
  }catch(err){ console.error('No se pudo leer el catálogo de uniformes, se usa el de arranque:', err); }
  UNIFORMS = Object.values(porId).sort((a,b) => (a.orden??999) - (b.orden??999));
}

let ordersUnsub = null;

function subscribeOrders(){
  if(ordersUnsub) return;
  const q = query(collection(db, 'pedidos'), orderBy('createdAt', 'desc'));
  let primeraCarga = true;
  ordersUnsub = onSnapshot(q, (snap) => {
    state.orders = snap.docs.map(d => d.data());
    // pedidos que llegan con el panel abierto (no los que ya estaban al entrar): letrero + sonido
    if(!primeraCarga){
      const nuevos = snap.docChanges().filter(c => c.type === 'added').map(c => c.doc.data().folio);
      if(nuevos.length){ state.pedidosNuevos = [...new Set([...(state.pedidosNuevos||[]), ...nuevos])]; sonarAviso(); }
    }
    primeraCarga = false;
    render();
  }, (err) => console.error('Error escuchando pedidos:', err));
}

function unsubscribeOrders(){
  if(ordersUnsub){ ordersUnsub(); ordersUnsub = null; }
  unsubscribeAvisos();
}

function sonarAviso(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.18].forEach((t, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = i ? 1046 : 784; g.gain.setValueAtTime(0.15, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.3);
      o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.3);
    });
  }catch(e){}
}

let avisosUnsub = null;

function subscribeAvisos(){
  if(avisosUnsub) return;
  const q = query(collection(db, 'avisos'), orderBy('createdAt', 'desc'));
  avisosUnsub = onSnapshot(q, (snap) => {
    state.avisos = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    render();
  }, (err) => console.error('Error escuchando avisos:', err));
}

function unsubscribeAvisos(){
  if(avisosUnsub){ avisosUnsub(); avisosUnsub = null; }
  state.avisos = [];
}

// una prenda puede tener varias fotos (fotos[]); foto = la principal (fotos[0])
function normalizarUniforme(u, i){
  const o = Object.assign({ price:null, tallas:SIZES.slice(), activo:true, orden:i, foto:'' }, u);
  o.fotos = (o.fotos && o.fotos.length) ? o.fotos.slice() : (o.foto ? [o.foto] : []);
  o.foto = o.fotos[0] || '';
  return o;
}

function uniformesVisibles(){ return UNIFORMS.filter(u => u.activo !== false); }

function uniInfo(id){ return UNIFORMS.find(u => u.id === id) || { id, name:'Prenda', price:0, tallas:[], foto:'' }; }

// existencias: un artículo que no está dado de alta en inventario cuenta como 0 (igual que en el panel)
function stockDe(invKey){ return state.inventory[invKey] ?? 0; }

// clave de inventario: útiles = {docId de la lista}_{posición}; uniformes = {id}_{talla}
function invKeyUtil(grade, i){ return GRADES[grade].docId + '_' + i; }

function utilDisponible(grade, i){ return stockDe(invKeyUtil(grade, i)) > 0; }

function uniTallaSel(uniId){ const t = uniInfo(uniId).tallas || []; return t.includes(state.uniSel[uniId]) ? state.uniSel[uniId] : (t[0] || ''); }

function avisosPendientes(){ return state.avisos.filter(a => a.estado === 'pendiente'); }

// avisos pendientes cuya prenda/talla ya tiene existencias: hay que avisarle a esos papás
function avisosListos(){ return avisosPendientes().filter(a => stockDe(a.uniformeId+'_'+a.talla) > 0); }

function seccionDe(t){ const n = normTexto(t); return n.includes('libro') ? 'LIBROS' : n.includes('forr') ? 'PARA FORRAR' : 'MATERIAL DIARIO'; }

/* ================= CARRITO Y ALUMNOS — canastas por grado, hermanos y gemelos ================= */

// una "canasta" (basketId) es normalmente el nombre del grado tal cual ("1° PRIMARIA"), pero cuando
// hay gemelos/cuates en el mismo grado se crean canastas extra con sufijo ("1° PRIMARIA#2", "#3"...)
// para que cada alumno tenga su propia lista independiente del mismo grado.
function gradeNameOf(basketId){
  return basketId.split('#')[0];
}

function basketsForGrade(grade){
  return Object.keys(state.gradeQtys).filter(k => gradeNameOf(k)===grade);
}

function newBasketId(grade){
  let n = 2;
  while(state.gradeQtys[grade+'#'+n] !== undefined) n++;
  return grade+'#'+n;
}

function ensureGradeQtys(basketId){
  if(!state.gradeQtys[basketId]){
    const qtys = {};
    GRADES[gradeNameOf(basketId)].items.forEach((it,i) => qtys[i] = it.cantidad); // por defecto: cantidad sugerida completa
    state.gradeQtys[basketId] = qtys;
  }
  return state.gradeQtys[basketId];
}

function gradeSubtotal(basketId){
  const qtys = state.gradeQtys[basketId];
  if(!qtys) return 0;
  return GRADES[gradeNameOf(basketId)].items.reduce((sum, it, i) => sum + ((qtys[i]||0) * it.precio_unitario), 0);
}

function utilesTotal(){
  return Object.keys(state.gradeQtys).reduce((s,g) => s + gradeSubtotal(g), 0);
}

function utilesCount(){
  return Object.keys(state.gradeQtys).reduce((s,g) => s + Object.values(state.gradeQtys[g]).reduce((a,b)=>a+(b||0),0), 0);
}

function uniformsTotal(){
  return state.uniformCart.reduce((s,u) => s + (uniInfo(u.id).price * u.qty), 0);
}

function uniformsCount(){
  return state.uniformCart.reduce((s,u)=>s+u.qty, 0);
}

function cartCount(){ return utilesCount() + uniformsCount(); }

function cartSubtotal(){ return utilesTotal() + uniformsTotal(); }

// artículos de una lista que no hay en existencia (no se pudieron elegir): el papá debe saber que no
// se lleva el paquete completo. Lo que él desmarcó a propósito no cuenta aquí.
function noDisponiblesDeLista(basketId){
  const grade = gradeNameOf(basketId);
  return GRADES[grade].items.map((it,i) => ({ it, i })).filter(({i}) => !utilDisponible(grade, i)).map(({it}) => it);
}

function gradosActivosEnCarrito(){
  return Object.keys(state.gradeQtys).filter(g => Object.values(state.gradeQtys[g]).some(q=>q>0));
}

function newStudentId(){
  return 'al_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function studentById(id){
  return state.students.find(s=>s.id===id) || null;
}

function nombreCompleto(cliente){
  return [cliente.nombres, cliente.apellidoPaterno, cliente.apellidoMaterno].filter(Boolean).join(' ').trim();
}

function clienteValido(){
  return telValido(state.cliente.telefono) && state.students.length>0;
}

function uniformAssignTotal(u){
  return Object.values(u.assign||{}).reduce((a,b)=>a+(b||0),0);
}

// ¿hay algo en el carrito (lista de útiles con subtotal>0, o uniforme) sin asignar a un alumno?
function siguienteAsignacionPendiente(){
  for(const g of Object.keys(state.gradeQtys)){
    if(gradeSubtotal(g) > 0 && !state.gradeAssign[g]) return { kind:'grade', grade:g };
  }
  for(let i=0;i<state.uniformCart.length;i++){
    const u = state.uniformCart[i];
    if(uniformAssignTotal(u) < u.qty) return { kind:'uniform', uniIndex:i };
  }
  return null;
}

function abrirSiguienteAsignacionSiHaceFalta(){
  if(state.pendingAssign) return;
  const next = siguienteAsignacionPendiente();
  if(!next) return;
  const step = state.students.length===0 ? 'nuevo' : (state.students.length===1 ? 'mismo' : 'elegir');
  state.pendingAssign = Object.assign(next, { step, nuevo:{ nombres:'', apellidoPaterno:'', apellidoMaterno:'', grado: next.kind==='grade' ? gradeNameOf(next.grade) : '' } });
}

function etiquetaAsignacionPendiente(){
  const p = state.pendingAssign;
  if(!p) return '';
  if(p.kind==='grade'){
    return 'la lista de ' + gradoLargo(gradeNameOf(p.grade));
  }
  if(p.kind==='uniform'){
    const u = state.uniformCart[p.uniIndex];
    if(!u) return '';
    const info = uniInfo(u.id);
    return u.qty + ' × ' + (info?info.name:u.id) + ', talla ' + u.size;
  }
  return '';
}

function asignarPendienteA(studentId){
  const p = state.pendingAssign;
  if(!p) return;
  if(p.kind==='grade'){
    state.gradeAssign[p.grade] = studentId;
  } else if(p.kind==='uniform'){
    const u = state.uniformCart[p.uniIndex];
    if(u){
      if(!u.assign) u.assign = {};
      const falta = u.qty - uniformAssignTotal(u);
      u.assign[studentId] = (u.assign[studentId]||0) + falta;
    }
  }
  // kind 'manual' (agregar otro alumno desde el carrito): no hay nada que asignar, solo se registró el alumno.
  state.pendingAssign = null;
  abrirSiguienteAsignacionSiHaceFalta();
  render();
}

function cancelarPendiente(){
  const p = state.pendingAssign;
  if(p){
    if(p.kind==='grade') delete state.gradeQtys[p.grade];
    else if(p.kind==='uniform'){
      const u = state.uniformCart[p.uniIndex];
      if(u){
        const asignado = uniformAssignTotal(u);
        if(asignado<=0) state.uniformCart.splice(p.uniIndex,1);
        else u.qty = asignado; // descarta solo las unidades nuevas que no se habían repartido
      }
    }
  }
  state.pendingAssign = null;
  abrirSiguienteAsignacionSiHaceFalta();
  render();
}

// alumnos que ya tienen algo asignado en el carrito actual (para mostrarlos agrupados)
function alumnosActivosEnCarrito(){
  const ids = new Set();
  Object.values(state.gradeAssign).forEach(id => { if(id) ids.add(id); });
  state.uniformCart.forEach(u => Object.keys(u.assign||{}).forEach(id => { if((u.assign[id]||0)>0) ids.add(id); }));
  return state.students.filter(s=>ids.has(s.id));
}

function subtotalAlumno(studentId){
  let sum = 0;
  Object.keys(state.gradeAssign).forEach(g => { if(state.gradeAssign[g]===studentId) sum += gradeSubtotal(g); });
  state.uniformCart.forEach(u => {
    const units = (u.assign||{})[studentId] || 0;
    if(units>0){ const info = uniInfo(u.id); sum += info.price * units; }
  });
  return sum;
}

// ¿todas las piezas de uniforme con varios alumnos quedaron completamente repartidas?
function carritoRepartidoCompleto(){
  if(siguienteAsignacionPendiente()) return false;
  return state.uniformCart.every(u => uniformAssignTotal(u) === u.qty);
}

// mueve 1 unidad de una pieza de uniforme hacia/desde un alumno. Con 2 alumnos se balancea solo;
// con 3 o más, cada +/- es independiente (y el carrito marca en rojo si no suman la cantidad total).
function ajustarReparto(uniIdx, studentId, delta){
  const u = state.uniformCart[uniIdx];
  if(!u) return;
  if(!u.assign) u.assign = {};
  const ids = state.students.map(s=>s.id);
  if(ids.length === 2){
    const otherId = ids.find(id=>id!==studentId);
    const cur = u.assign[studentId]||0, otherCur = u.assign[otherId]||0;
    const next = cur + delta, otherNext = otherCur - delta;
    if(next < 0 || next > u.qty || otherNext < 0 || otherNext > u.qty) return;
    u.assign[studentId] = next;
    u.assign[otherId] = otherNext;
  } else {
    const cur = u.assign[studentId]||0;
    const sumOtros = Object.keys(u.assign).reduce((s,id) => id===studentId ? s : s+(u.assign[id]||0), 0);
    let next = cur + delta;
    if(next < 0) next = 0;
    if(next + sumOtros > u.qty) next = u.qty - sumOtros;
    u.assign[studentId] = next;
  }
  render();
}

/* ================= ENVÍO A DOMICILIO — tarifa por zonas y cálculo básico (sin mapa) ================= */

function deliveryKm(){
  return (state.kmAuto !== null && state.kmAuto !== undefined) ? state.kmAuto : null;
}

function zonaEnvio(km){ return ZONAS_ENVIO.find(z => km <= z.hastaKm); }

function deliveryFee(){
  if(state.fulfillment !== 'delivery') return 0;
  const km = deliveryKm();
  if(km === null) return null;
  return zonaEnvio(km).costo;
}

function grandTotal(){
  const fee = deliveryFee();
  return cartSubtotal() + (fee || 0);
}

function tarifasEnvioTexto(){
  let desde = 0;
  return ZONAS_ENVIO.map(z => {
    const t = z.hastaKm === Infinity ? `más de ${desde} km ${money(z.costo)}` : `${desde ? desde+'–' : 'hasta '}${z.hastaKm} km ${money(z.costo)}`;
    desde = z.hastaKm; return t;
  }).join(' · ');
}

function computeEstimatedReady(){
  const days = state.fulfillment === 'delivery' ? 2 : 1;
  return addBusinessDays(new Date(), days);
}

function canContinueFromDelivery(){
  if(state.fulfillment === 'pickup') return true;
  if(state.fulfillment === 'delivery') return deliveryFee() !== null && state.direccion.trim().length > 8
    && state.geoStatus !== 'loading' && (!usarGoogleMaps() || (!!state.destino && state.ubicacionConfirmada));
  return false;
}

async function geocodeAddress(q){
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=mx&accept-language=es&q=' + encodeURIComponent(q);
  const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
  if(!res.ok) throw new Error('geo-http-' + res.status);
  const arr = await res.json();
  if(!arr.length) return null;
  return { lat: parseFloat(arr[0].lat), lng: parseFloat(arr[0].lon) };
}

async function calcularDistancia(){
  const dir = state.direccion.trim();
  if(dir.length < 8) return;
  state.geoStatus = 'loading'; state.geoMessage = ''; render();
  try{
    const dest = await geocodeAddress(dir);
    if(!dest){
      state.geoStatus = 'error'; state.kmAuto = null;
      state.geoMessage = 'No pudimos ubicar esa dirección. Agrega colonia, alcaldía/municipio o código postal, y vuelve a intentar.';
    } else {
      state.kmAuto = kmAproximados(STORE_COORDS, dest);
      state.geoStatus = 'ok'; state.geoMessage = '';
    }
  }catch(e){
    console.error(e);
    state.geoStatus = 'error'; state.kmAuto = null;
    state.geoMessage = 'No pudimos calcular la distancia en este momento. Revisa tu conexión e intenta de nuevo.';
  }
  render();
}

// ligas para que el repartidor navegue al punto exacto que marcó el papá
function ligasNavegacion(o){
  if(!o.destino) return '';
  const lat = Number(o.destino.lat), lng = Number(o.destino.lng);
  if(!isFinite(lat) || !isFinite(lng)) return '';
  const ll = lat.toFixed(6) + ',' + lng.toFixed(6);
  return `<div style="display:flex; gap:8px; flex-wrap:wrap; margin:6px 0;">
    <a class="btn btn-secondary btn-sm" target="_blank" rel="noopener" style="text-decoration:none;" href="https://www.google.com/maps/dir/?api=1&destination=${ll}">🗺️ Abrir en Google Maps</a>
    <a class="btn btn-secondary btn-sm" target="_blank" rel="noopener" style="text-decoration:none;" href="https://waze.com/ul?ll=${ll}&navigate=yes">🚗 Abrir en Waze</a>
  </div>`;
}

/* ================= ENVÍO A DOMICILIO — mapa de Google ================= */

// El mapa vive en un nodo que se crea UNA vez (mapaUI) y que después de cada render() se vuelve a
// colocar en #mapaSlot: así el re-render de toda la página no destruye el mapa ni el buscador.
let gmPromesa = null, gmFallo = false;

let mapaUI = null, gMapa = null, gRuta = null, gPin = null, rutaTimer = null;

function usarGoogleMaps(){ return GOOGLE_MAPS_KEY !== 'PENDIENTE' && !gmFallo; }

window.gm_authFailure = () => { gmFallo = true; console.error('Google Maps rechazó la llave (revisa restricciones y APIs habilitadas).'); render(); };

function cargarGoogleMaps(){
  if(gmPromesa) return gmPromesa;
  gmPromesa = new Promise((resolve, reject) => {
    window.__liceoMapsListo = resolve;
    const sc = document.createElement('script');
    sc.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(GOOGLE_MAPS_KEY)}&v=weekly&language=es&region=MX&loading=async&callback=__liceoMapsListo`;
    sc.async = true; sc.onerror = () => reject(new Error('No cargó Google Maps'));
    document.head.appendChild(sc);
  });
  return gmPromesa;
}

function crearMapaUI(){
  mapaUI = document.createElement('div');
  mapaUI.className = 'mapa-ui';
  mapaUI.innerHTML = `
    <label class="mapa-label">Busca tu dirección</label>
    <div class="mapa-buscador"></div>
    <button type="button" class="btn btn-secondary btn-sm mapa-gps">📍 Usar mi ubicación actual</button>
    <div class="mapa-box"><div class="mapa"></div></div>
    <div class="mapa-ayuda"><b>Toca en el mapa el lugar exacto de tu casa.</b> Si el pin no quedó bien, arrástralo. El costo se calcula con la ruta en coche desde el local.</div>`;
  (async () => {
    try{
      await cargarGoogleMaps();
      const { Map, Polyline } = await google.maps.importLibrary('maps');
      await google.maps.importLibrary('geometry');
      const { PlaceAutocompleteElement } = await google.maps.importLibrary('places');
      const inicio = state.destino || STORE_COORDS;
      gMapa = new Map(mapaUI.querySelector('.mapa'), { center: inicio, zoom: state.destino ? 17 : 14,
        disableDefaultUI: true, zoomControl: true, gestureHandling: 'greedy', clickableIcons: false });
      gRuta = new Polyline({ map: gMapa, strokeColor: '#22355F', strokeOpacity: 0.85, strokeWeight: 4 });
      // pin de la casa: se pone tocando el mapa y se puede arrastrar (google.maps.Marker clásico,
      // porque el AdvancedMarkerElement exige crear un Map ID en la consola)
      gPin = new google.maps.Marker({ map: gMapa, draggable: true, position: state.destino || null, visible: !!state.destino, title: 'Tu casa' });
      gPin.addListener('dragend', () => { const p = gPin.getPosition(); ponerPin({ lat: p.lat(), lng: p.lng() }, false); });
      gMapa.addListener('click', (e) => { if(!gmFallo && e.latLng) ponerPin({ lat: e.latLng.lat(), lng: e.latLng.lng() }, false); });
      const pac = new PlaceAutocompleteElement({ includedRegionCodes: ['mx'], locationBias: { center: STORE_COORDS, radius: 30000 } });
      pac.style.width = '100%';
      mapaUI.querySelector('.mapa-buscador').appendChild(pac);
      const alElegir = async (ev) => {
        const place = ev.placePrediction ? ev.placePrediction.toPlace() : ev.place;
        if(!place) return;
        await place.fetchFields({ fields: ['formattedAddress', 'location'] });
        if(place.formattedAddress){ state.direccion = place.formattedAddress; state.direccionAuto = true; }
        if(place.location) ponerPin({ lat: place.location.lat(), lng: place.location.lng() }, true, !!place.formattedAddress);
        else render();
      };
      pac.addEventListener('gmp-select', alElegir);
      pac.addEventListener('gmp-placeselect', alElegir);   // nombre anterior del evento
      mapaUI.querySelector('.mapa-gps').addEventListener('click', () => {
        if(!navigator.geolocation){ alert('Tu navegador no permite usar la ubicación.'); return; }
        navigator.geolocation.getCurrentPosition(
          (pos) => ponerPin({ lat: pos.coords.latitude, lng: pos.coords.longitude }, true),
          () => alert('No pudimos obtener tu ubicación. Revisa que hayas dado permiso, o busca tu dirección.'),
          { enableHighAccuracy: true, timeout: 10000 });
      });
    }catch(err){
      console.error(err);
      gmFallo = true; render();   // sin Google Maps: vuelve al cálculo básico
    }
  })();
}

function montarMapa(){
  const slot = document.getElementById('mapaSlot');
  if(!slot) return;
  if(!mapaUI) crearMapaUI();
  slot.appendChild(mapaUI);
}

// coloca (o mueve) el pin de la casa; cualquier cambio obliga a volver a confirmar la ubicación.
// Si el papá no ha escrito su dirección a mano, se llena sola con la dirección del punto.
function ponerPin(pnt, centrar, direccionYaPuesta){
  state.destino = pnt;
  state.ubicacionConfirmada = false;
  gPin.setPosition(pnt); gPin.setVisible(true);
  if(centrar){ gMapa.setCenter(pnt); gMapa.setZoom(18); }
  clearTimeout(rutaTimer); rutaTimer = setTimeout(calcularRuta, 300);
  if(!direccionYaPuesta && (!state.direccion.trim() || state.direccionAuto)){
    direccionDePunto(pnt).then(d => {
      if(!d || state.destino !== pnt) return;                    // ya movió el pin otra vez
      if(state.direccion.trim() && !state.direccionAuto) return;   // mientras tanto la escribió a mano
      state.direccion = d; state.direccionAuto = true;
      render();
    });
  }
}

// dirección (calle y número, colonia, alcaldía, CP) de un punto del mapa: Google Geocoding si está
// habilitado en el proyecto; si no, OpenStreetMap (gratis, menos preciso con números de casa)
async function direccionDePunto(p){
  try{
    const { Geocoder } = await google.maps.importLibrary('geocoding');
    const { results } = await new Geocoder().geocode({ location: p, language: 'es', region: 'mx' });
    const r = (results || []).find(x => x.types.includes('street_address') || x.types.includes('premise')) || (results || [])[0];
    if(r && r.formatted_address) return r.formatted_address.replace(/, (México|Mexico|Méx\.)$/, '');
  }catch(err){ console.warn('Geocoding de Google no disponible; se usa OpenStreetMap.', err); }
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&accept-language=es&zoom=18&lat=${p.lat}&lon=${p.lng}`);
    const j = await res.json(); const a = j.address || {};
    const calle = [a.road, a.house_number].filter(Boolean).join(' ');
    return [calle, a.neighbourhood || a.suburb, a.city_district || a.borough || a.town || a.city, a.postcode].filter(Boolean).join(', ');
  }catch(err){ console.warn('No se pudo obtener la dirección del punto.', err); return ''; }
}

async function calcularRuta(){
  const d = state.destino;
  if(!d) return;
  state.geoStatus = 'loading'; state.geoMessage = ''; render();
  try{
    const res = await fetch('https://routes.googleapis.com/directions/v2:computeRoutes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': GOOGLE_MAPS_KEY,
        'X-Goog-FieldMask': 'routes.distanceMeters,routes.duration,routes.polyline.encodedPolyline' },
      body: JSON.stringify({
        origin: { location: { latLng: { latitude: STORE_COORDS.lat, longitude: STORE_COORDS.lng } } },
        destination: { location: { latLng: { latitude: d.lat, longitude: d.lng } } },
        travelMode: 'DRIVE', routingPreference: 'TRAFFIC_UNAWARE', languageCode: 'es-MX', units: 'METRIC' }),
    });
    if(!res.ok) throw new Error('routes-' + res.status);
    const data = await res.json();
    if(state.destino !== d) return;   // el papá movió el pin mientras se calculaba
    const r = data.routes && data.routes[0];
    if(!r){
      state.kmAuto = null; state.geoStatus = 'error';
      state.geoMessage = 'No encontramos una ruta en coche hasta ese punto. Mueve el pin a una calle cercana.';
      gRuta.setPath([]);
    } else {
      state.kmAuto = Math.round(r.distanceMeters / 100) / 10;
      state.rutaMin = Math.round(parseInt(r.duration) / 60);
      gRuta.setPath(google.maps.geometry.encoding.decodePath(r.polyline.encodedPolyline));
      state.geoStatus = 'ok';
    }
  }catch(err){
    console.error(err);
    if(state.destino !== d) return;
    // si falla la ruta, se cobra con la distancia aproximada para no frenar el pedido
    state.kmAuto = kmAproximados(STORE_COORDS, d);
    state.rutaMin = null; state.geoStatus = 'ok';
    state.geoMessage = 'No pudimos trazar la ruta; el envío se calculó con la distancia aproximada.';
    gRuta.setPath([]);
  }
  render();
}

/* ================= PAGO POR TRANSFERENCIA — revisión automática del comprobante ================= */

// Se lee el texto de la imagen en el navegador (Tesseract.js, gratis, sin servidor) y se exige que
// aparezca el monto exacto del pedido y al menos 2 palabras típicas de un comprobante bancario.
let tesseractPromesa = null;

function cargarTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tesseractPromesa) return tesseractPromesa;
  tesseractPromesa = new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    sc.onload = resolve; sc.onerror = () => { tesseractPromesa = null; reject(new Error('No cargó el lector de texto')); };
    document.head.appendChild(sc);
  });
  return tesseractPromesa;
}

// todos los importes que aparezcan en el texto, como números ($1,110.00 → 1110)
function montosEnTexto(t){
  const out = [];
  (t.match(/\$?\s?\d{1,3}(?:[,\s]\d{3})+(?:\.\d{1,2})?|\$?\s?\d+(?:\.\d{1,2})?/g) || []).forEach(m => {
    const n = parseFloat(m.replace(/[$\s,]/g, ''));
    if(isFinite(n)) out.push(n);
  });
  return out;
}

// clave de rastreo SPEI: lo que viene después de "rastreo" (misma línea o la siguiente)
function claveRastreoDe(texto){
  const lineas = texto.split(/\n/);
  for(let i = 0; i < lineas.length; i++){
    if(!/rastreo/i.test(lineas[i])) continue;
    const resto = (lineas[i].split(/rastreo/i)[1] || '') + ' ' + (lineas[i+1] || '');
    const m = resto.toUpperCase().replace(/[^A-Z0-9]+/g, ' ').match(/\b(?=[A-Z0-9]*\d)[A-Z0-9]{8,32}\b/);
    if(m) return m[0];
  }
  const m = texto.toUpperCase().match(/\bMBAN\d{14,26}\b/);
  return m ? m[0] : null;
}

// "huellas" del comprobante para que no se pueda usar en dos pedidos: la clave de rastreo (si tiene),
// el texto leído y el archivo mismo. Se guardan en comprobantes/{huella} al crear el pedido.
async function huellasComprobante(file, texto, clave){
  const h = ['t_' + await sha256Corto(normTexto(texto)), 'i_' + await sha256Corto(await file.arrayBuffer())];
  if(clave) h.unshift('r_' + clave);
  return h;
}

async function revisarComprobante(file, total){
  await cargarTesseract();
  const worker = await Tesseract.createWorker('spa');
  let texto = '';
  try{
    const { data } = await worker.recognize(file);
    texto = data.text || '';
  } finally {
    await worker.terminate();
  }
  const plano = normTexto(texto);
  const palabras = PALABRAS_COMPROBANTE.filter(w => plano.includes(w));
  const montoOk = montosEnTexto(texto).some(n => Math.abs(n - total) < 0.5);
  const claveRastreo = claveRastreoDe(texto);
  const huellas = await huellasComprobante(file, texto, claveRastreo);
  let duplicado = false;
  for(const id of huellas){
    if((await getDoc(doc(db, 'comprobantes', id))).exists()){ duplicado = true; break; }
  }
  return { montoOk, palabras, claveRastreo, huellas, duplicado, ok: montoOk && palabras.length >= 2 && !duplicado };
}

async function buildOrder(){
  const utilesItems = [];
  Object.keys(state.gradeQtys).forEach(g => {
    const realGrade = gradeNameOf(g);
    GRADES[realGrade].items.forEach((it,i) => {
      const qty = state.gradeQtys[g][i] || 0;
      if(qty>0) utilesItems.push({ descripcion: it.descripcion, qty, precio_unitario: it.precio_unitario, seccion: it.seccion || 'MATERIAL DIARIO', grade: realGrade, studentId: state.gradeAssign[g]||null, invKey: invKeyUtil(realGrade, i) });
    });
  });
  const uniformItems = state.uniformCart.map(u => {
    const info = uniInfo(u.id);
    const splits = Object.entries(u.assign||{}).filter(([,q])=>q>0).map(([studentId,q]) => ({studentId, qty:q}));
    return { id:u.id, name:info.name, size:u.size, qty:u.qty, price:info.price, splits, invKey: u.id+'_'+u.size };
  });
  const allItems = [...utilesItems, ...uniformItems];
  const noIncluidos = [];
  Object.keys(state.gradeQtys).forEach(g => {
    if(!Object.values(state.gradeQtys[g]).some(q => q > 0)) return;
    noDisponiblesDeLista(g).forEach(it => noIncluidos.push({ grade: gradeNameOf(g), studentId: state.gradeAssign[g] || null, descripcion: it.descripcion }));
  });
  const totales = { papeleria: 0, libros: 0, uniformesDetalle: {} };
  utilesItems.forEach(it => { const t = it.qty*it.precio_unitario; if(it.seccion==='LIBROS') totales.libros += t; else totales.papeleria += t; });
  uniformItems.forEach(u => { totales.uniformesDetalle[u.name] = (totales.uniformesDetalle[u.name]||0) + u.qty*u.price; });
  const fee = deliveryFee() || 0;
  const folio = 'AD-' + Math.floor(1000 + Math.random()*9000);
  const alumnos = alumnosActivosEnCarrito().map(al => ({ id:al.id, nombres:al.nombres, apellidoPaterno:al.apellidoPaterno, apellidoMaterno:al.apellidoMaterno, grado:al.grado||'' }));

  let comprobanteUrl = null;
  if(state.payment === 'transferencia' && state.comprobanteFile){
    const sref = storageRef(storage, `comprobantes/${folio}/comprobante.jpg`);
    await uploadBytes(sref, state.comprobanteFile);
    comprobanteUrl = await getDownloadURL(sref);
  }

  const order = {
    folio,
    createdAt: new Date().toISOString(),
    cliente: Object.assign({}, state.cliente),
    alumnos,
    items: {
      utiles: utilesItems.map(({invKey, ...rest}) => rest),
      uniformes: uniformItems.map(({invKey, ...rest}) => rest),
    },
    fulfillment: state.fulfillment,
    direccion: state.fulfillment==='delivery' ? state.direccion.trim() : '',
    referencias: state.fulfillment==='delivery' ? (state.referencias||'').trim() : '',
    destino: state.fulfillment==='delivery' && state.destino ? { lat: state.destino.lat, lng: state.destino.lng } : null,
    rutaMin: state.fulfillment==='delivery' ? state.rutaMin : null,
    deliveryFee: fee,
    deliveryKm: deliveryKm(),
    payment: state.payment,
    comprobante: comprobanteUrl,
    comprobanteRevision: comprobanteUrl && state.comprobanteRevision ? { montoOk: !!state.comprobanteRevision.montoOk, palabras: state.comprobanteRevision.palabras || [],
      claveRastreo: state.comprobanteRevision.claveRastreo || null } : null,
    totales,
    noIncluidos,                 // artículos de la lista sin existencia al momento del pedido
    pagoConfirmado: false,
    pagoConfirmadoAt: null,
    capturadoInnovat: false,
    subtotal: cartSubtotal(),
    total: grandTotal(),
    stageIndex: 0,
    ubicacion: '',
    signature: null,
    recibioNombre: null,
    completedAt: null,
    estimatedReady: computeEstimatedReady().toISOString(),
    smsLog: [{ message: `Liceo Alexander Dul: recibimos tu pedido ${folio} por ${money(cartSubtotal()+fee)}. Te avisaremos por mensaje conforme avance tu pedido.`, at: new Date().toISOString() }],
    historial: [{ texto: 'Pedido creado por el cliente', por: 'Cliente', at: new Date().toISOString() }],
    checklist: {},
  };

  // una llave de búsqueda por cada alumno (nombre completo + teléfono), todas apuntando al mismo folio,
  // para que desde "olvidé mi folio" se pueda encontrar el pedido con el nombre de cualquiera de los hermanos.
  const telDigits = state.cliente.telefono.replace(/\D/g,'');
  const busquedaKeys = alumnos.map(al => slug(nombreCompleto(al)) + '_' + telDigits);

  // se juntan las cantidades por artículo de inventario: dos hermanos con la misma lista (o la misma
  // prenda/talla) comparten documento y hay que descontar la suma, no solo la última.
  const qtyPorInvKey = {};
  allItems.forEach(it => { qtyPorInvKey[it.invKey] = (qtyPorInvKey[it.invKey]||0) + it.qty; });
  const invKeys = Object.keys(qtyPorInvKey);

  const huellas = (state.payment === 'transferencia' && state.comprobanteRevision && state.comprobanteRevision.huellas) || [];
  await runTransaction(db, async (tx) => {
    const invRefs = invKeys.map(k => doc(db, 'inventario', k));
    const snaps = await Promise.all(invRefs.map(r => tx.get(r)));
    const huellaRefs = huellas.map(h => doc(db, 'comprobantes', h));
    const huellaSnaps = await Promise.all(huellaRefs.map(r => tx.get(r)));
    if(huellaSnaps.some(x => x.exists())) throw new Error('comprobante-duplicado');
    huellaRefs.forEach(r => tx.set(r, { folio, at: new Date().toISOString() }));
    const orderRef = doc(db, 'pedidos', folio);
    tx.set(orderRef, order);
    busquedaKeys.forEach(key => tx.set(doc(db, 'busquedas', key), { folio }));
    invRefs.forEach((r, i) => {
      // si el artículo no existe en inventario (p. ej. una talla nueva que nunca se dio de alta),
      // no se puede descontar, pero el pedido sí se guarda; el cliente no tiene permiso de crear inventario.
      if(!snaps[i].exists()) return;
      const current = snaps[i].data().stock || 0;
      tx.update(r, { stock: Math.max(0, current - qtyPorInvKey[invKeys[i]]) });
    });
  });

  invKeys.forEach(k => {
    if(k in state.inventory) state.inventory[k] = Math.max(0, state.inventory[k] - qtyPorInvKey[k]);
  });
  state.orders.push(order);
  return order;
}

function stageLabel(order, idx){

function orderTotals(o){
  if(o.totales && o.totales.uniformesDetalle) return o.totales;
  const t = { papeleria:0, libros:0, uniformesDetalle:{} };
  ((o.items && o.items.utiles) || []).forEach(it => { const v = it.qty*it.precio_unitario; if(it.seccion==='LIBROS') t.libros += v; else t.papeleria += v; });
  ((o.items && o.items.uniformes) || []).forEach(u => { t.uniformesDetalle[u.name] = (t.uniformesDetalle[u.name]||0) + u.qty*u.price; });
  return t;
}

function uniformesTotalOrden(o){
  const d = orderTotals(o).uniformesDetalle || {};

}

let emailjsListo = false;

function emailjsDisponible(){
  if(emailjsListo) return true;
  if(typeof emailjs === 'undefined') return false;
  if(EMAILJS_PUBLIC_KEY === 'PENDIENTE') return false;
  try{ emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY }); emailjsListo = true; }
  catch(err){ console.error('No se pudo inicializar EmailJS:', err); return false; }
  return true;
}

// {{asunto}} es el asunto de la plantilla; name/message: la plantilla base de EmailJS usa esos nombres
async function enviarCorreo(to_email, to_name, folio, mensaje, asunto){
  if(!emailjsDisponible()) return false;
  try{
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { to_email, to_name, folio, mensaje, asunto, name: to_name, message: mensaje });
    return true;
  }catch(err){ console.error('No se pudo enviar el correo a ' + to_email + ':', err); return false; }
}

// manda el aviso de cambio de estado por correo al papá/mamá (si dejó correo). Sin copia al personal:
// el personal es quien cambia el estado, y así se ahorra cupo del plan gratis de EmailJS (200 al mes).
// nunca truena el flujo del pedido: si el correo falla, solo se queda en la consola.
async function enviarCorreoEstado(order, mensaje){
  if(!(order.cliente && order.cliente.correo)) return;
  await enviarCorreo(order.cliente.correo, alumnosLabel(order), order.folio, mensaje, `Tu pedido ${order.folio} - Liceo Alexander Dul`);
}

// aviso al personal de que entró un pedido nuevo
function avisarStaffPedidoNuevo(order){
  if(STAFF_NOTIFY_EMAIL === 'PENDIENTE') return;
  const entrega = order.fulfillment === 'delivery'
    ? `envío a domicilio (${order.direccion}${order.referencias ? '; ref.: '+order.referencias : ''})${order.destino ? ' — mapa: https://www.google.com/maps/search/?api=1&query='+order.destino.lat.toFixed(6)+','+order.destino.lng.toFixed(6) : ''}`
    : 'recoger en el local';
  const pago = order.payment === 'transferencia' ? 'transferencia (revisar comprobante)' : 'efectivo';
  const mensaje = `Entró el pedido ${order.folio} por ${money(order.total)}. Alumno(s): ${alumnosLabel(order)}. Entrega: ${entrega}. Pago: ${pago}. Tel. ${order.cliente.telefono}. Revísalo en el panel de personal.`;
  enviarCorreo(STAFF_NOTIFY_EMAIL, STAFF_NOTIFY_NAME, order.folio, mensaje, `Nuevo pedido ${order.folio} - ${money(order.total)}`);
}

// cuando una prenda/talla agotada vuelve a tener existencias y hay papás esperando, avisa al personal por correo
function avisarStaffExistencias(uniName, talla, cuantos){
  if(STAFF_NOTIFY_EMAIL === 'PENDIENTE') return;
  const mensaje = `Ya hay existencias de ${uniName} talla ${talla} y ${cuantos} ${cuantos===1?'papá está esperando':'papás están esperando'} el aviso. Entra al panel de personal → Avisos para avisarles.`;

}

        return `<button class="grade-card" data-grade="${esc(g)}">
          <div class="num">${esc(label)}</div>
          <div class="lbl">Primaria</div>
          <div class="price">Paquete: ${money(GRADES[g].total_paquete)}</div>
          ${n>0 ? `<div style="font-size:0.74rem; color:var(--green); margin-top:4px; font-weight:700;">✓ ${n>1?n+' listas ya agregadas':'Ya tienes una lista'}</div>` : ''}
        </button>`;
      }).join('')}
    </div>
  </section>`;
}

function gradeListView(basketId){
  const grade = gradeNameOf(basketId);
  const data = GRADES[grade];
  const qtys = ensureGradeQtys(basketId);
  const label = gradoCorto(grade);
  const sections = ['MATERIAL DIARIO','PARA FORRAR','LIBROS'];
  const sectionLabels = {'MATERIAL DIARIO':'Material de uso diario', 'PARA FORRAR':'Para forrar', 'LIBROS':'Libros de texto'};
  const sub = gradeSubtotal(basketId);
  const gid = idSafe(basketId);
  const dueño = state.gradeAssign[basketId] ? studentById(state.gradeAssign[basketId]) : null;
  const otrasCanastas = basketsForGrade(grade).length > 1;

  const sectionsHtml = sections.map(sec => {
    const rows = data.items.map((it,i) => ({it,i})).filter(x => x.it.seccion === sec);
    if(!rows.length) return '';
    return `
    <div class="section-block">
      <div class="section-title">
        <span>${sectionLabels[sec]}</span>
        <button data-toggle-section="${sec}" data-grade="${esc(basketId)}">activar/desactivar todo</button>
      </div>
      ${rows.map(({it,i}) => {
        const stock = stockDe(invKeyUtil(grade, i));
        if(stock <= 0){
          // útiles y libros agotados: solo se marcan como no disponibles (no hay "avísame")
          return `
        <div class="item-row unselected">
          <div class="info">
            <div class="desc">${esc(it.descripcion)}</div>
            <div class="qty">Sugerido: ${it.cantidad} · P. unitario ${money(it.precio_unitario)} · <span style="color:var(--red); font-weight:700;">No disponible por ahora</span></div>
          </div>
          <div class="stepper">
            <button type="button" disabled>−</button>
            <input type="text" value="0" disabled>
            <button type="button" disabled>+</button>
          </div>
          <div class="amt">—</div>
        </div>`;
        }
        const qty = qtys[i]||0;
        return `
        <div class="item-row ${qty>0?'':'unselected'}">
          <div class="info">
            <div class="desc">${esc(it.descripcion)}</div>
            <div class="qty">Sugerido: ${it.cantidad} · P. unitario ${money(it.precio_unitario)} ${stock<5 ? '· <span style="color:var(--red)">pocas existencias</span>' : ''}</div>
          </div>
          <div class="stepper">
            <button type="button" data-qty-dec="${i}" data-grade="${esc(basketId)}">−</button>
            <input type="text" inputmode="numeric" pattern="[0-9]*" id="qty_${gid}_${i}" value="${qty}" data-qty-input="${i}" data-grade="${esc(basketId)}">
            <button type="button" data-qty-inc="${i}" data-grade="${esc(basketId)}">+</button>
          </div>
          <div class="amt">${money(qty*it.precio_unitario)}</div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');

  return `
  <section class="view">
    <button class="backlink" data-back-grades="1">← Cambiar de grado</button>
    <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;">
      <h2 style="margin:0">${esc(label)} de primaria${dueño ? ' <span style="font-size:0.7em; color:var(--ink-soft); font-weight:400;">· para '+esc(nombreCompleto(dueño))+'</span>' : ''}</h2>
      <button class="btn btn-secondary btn-sm" data-download-lista="${esc(grade)}">🖨️ Descargar / imprimir lista (PDF)</button>
    </div>
    ${otrasCanastas ? `<div class="note-box neutral" style="margin-bottom:10px;">Tienes más de una lista de ${esc(label)} de primaria en este pedido (por ejemplo, gemelos en el mismo grado). Entra desde el carrito a "editar esta lista" para no confundirlas.</div>` : ''}
    <div class="preset-row">
      <button class="btn btn-secondary btn-sm" data-preset="completo" data-grade="${esc(basketId)}">📦 Paquete completo</button>
      <button class="btn btn-secondary btn-sm" data-preset="libros" data-grade="${esc(basketId)}">📚 Solo libros</button>
      <button class="btn btn-secondary btn-sm" data-preset="diario" data-grade="${esc(basketId)}">✏️ Solo material diario</button>
      <button class="btn btn-secondary btn-sm" data-preset="ninguno" data-grade="${esc(basketId)}">✖️ Quitar todo</button>
    </div>
    ${sectionsHtml}
    <div class="summary-bar">
      <div class="tot"><div class="label">Subtotal de esta lista</div><div class="amt">${money(sub)}</div></div>
      <button class="btn btn-primary" data-nav="carrito">Ir al carrito →</button>
    </div>
  </section>`;
}

function downloadListaPDF(grade){
  const data = GRADES[grade];
  const label = gradoLargo(grade);
  const sectionLabels = { 'MATERIAL DIARIO': 'Material de uso diario', 'PARA FORRAR': 'Para forrar', 'LIBROS': 'Libros de texto' };

  let rowsHtml = '';
  let currentSection = null;
  data.items.forEach(it => {
    if(it.seccion !== currentSection){
      currentSection = it.seccion;
      rowsHtml += `<tr><td colspan="4" style="background:#eef1f7; font-weight:700; padding:6px 8px;">${esc(sectionLabels[currentSection] || currentSection)}</td></tr>`;
    }
    rowsHtml += `<tr>
      <td style="text-align:center;">${it.cantidad}</td>
      <td>${esc(it.descripcion)}</td>
      <td style="text-align:right;">${money(it.precio_unitario)}</td>
      <td style="text-align:right;">${money(it.total != null ? it.total : it.cantidad*it.precio_unitario)}</td>
    </tr>`;
  });

  const win = window.open('', '_blank');
  if(!win){ alert('Tu navegador bloqueó la ventana de impresión. Permite ventanas emergentes para este sitio e intenta de nuevo.'); return; }
  win.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Lista de útiles - ${esc(label)}</title>
  <style>
    body{ font-family: Arial, Helvetica, sans-serif; color:#23304a; margin:24px; }
    h1{ font-size:18px; margin:0 0 2px; } h2{ font-size:14px; margin:0 0 16px; font-weight:400; color:#5b6785; }
    table{ width:100%; border-collapse:collapse; font-size:13px; }
    td, th{ border:1px solid #cfd5e3; padding:5px 8px; }
    th{ background:#22355F; color:#fff; text-align:left; }
    .totales{ margin-top:14px; text-align:right; font-size:14px; }
    .totales b{ font-size:16px; }
  </style>
  </head><body>
    <h1>Liceo Alexander Dul</h1>
    <h2>Lista de útiles — ${esc(label)} — Ciclo 2026-2027</h2>
    <table>
      <thead><tr><th>Cant.</th><th>Material</th><th>P. unitario</th><th>Total</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    <div class="totales">
      <div>Total libros: ${money(data.total_libros)}</div>
      <div><b>Total paquete completo: ${money(data.total_paquete)}</b></div>
    </div>
    <script>window.onload = function(){ window.print(); };<\/script>
  </body></html>`);
  win.document.close();
}

// foto(s) de la tarjeta: la principal (clic = verla en grande) y miniaturas si hay más de una

  if(!u.fotos.length) return `<div class="uni-foto uni-sin-foto">${u.icon||'👕'}</div>`;
  const idx = Math.min(state.uniFotoIdx[u.id]||0, u.fotos.length-1);
  return `<button type="button" class="uni-foto-btn" data-lightbox="${esc(u.id)}" data-idx="${idx}" title="Ver en grande">
      <img class="uni-foto" src="${esc(u.fotos[idx])}" alt="${esc(u.name)}">
      ${u.fotos.length > 1 ? `<span class="uni-foto-n">${idx+1}/${u.fotos.length}</span>` : ''}
    </button>
    ${u.fotos.length > 1 ? `<div class="uni-thumbs">${u.fotos.map((f,i) => `<button type="button" class="uni-thumb ${i===idx?'activa':''}" data-uni-thumb="${esc(u.id)}" data-idx="${i}"><img src="${esc(f)}" alt="Foto ${i+1}"></button>`).join('')}</div>` : ''}`;
}

function lightboxHtml(){

      </div>

}

// tarjeta de uniforme agotado en la talla elegida: "no hay, pero te avisamos cuando haya"

  const f = state.avisoForm;
  const abierto = f && f.uniId === u.id && f.size === talla;

    return `<div class="note-box">✓ Listo. Te avisaremos al ${esc(f.telefono)} y a ${esc(f.correo)} en cuanto haya talla ${esc(talla)}.</div>`;

    return `<div style="color:var(--red); font-weight:700; font-size:0.85rem; margin-bottom:6px;">No hay en talla ${esc(talla)} por ahora</div>

  const telOk = telValido(f.telefono);
  const correoOk = correoValido(f.correo);

    <div class="field-col"><label>Correo electrónico</label><input type="text" inputmode="email" autocomplete="email" id="avisoCorreo" value="${esc(f.correo)}" placeholder="Ej. mama@correo.com"></div>

      <button class="btn btn-ghost" id="avisoCancelarBtn">Cancelar</button>
    </div>`;
}

function splitControlHtml(uniIdx, u){
  // control para repartir las unidades de una pieza de uniforme entre los alumnos del pedido
  if(state.students.length < 2) return '';
  const total = uniformAssignTotal(u);
  const faltan = u.qty - total;
  const manual = state.students.length > 2;
  return `
    <div style="margin-top:6px; padding:8px 10px; background:var(--navy-tint); border-radius:4px;">
      <div style="font-size:0.74rem; color:var(--ink-soft); margin-bottom:4px;">Repartir entre:</div>

        const val = (u.assign||{})[s.id] || 0;
        return `<div class="split-row">

          <div class="stepper ${faltan!==0?'unbalanced':''}">

}

function cartView(){
  const gradeKeys = gradosActivosEnCarrito();
  const hasUniforms = state.uniformCart.length > 0;
  if(!gradeKeys.length && !hasUniforms){
    return `
    <section class="view empty-state">
      <div class="big">🛒</div>
      <h2>Tu carrito está vacío</h2>
      <p>Elige una lista de útiles o algún uniforme para empezar.</p>
      <button class="btn btn-primary" data-nav="utiles" style="margin-top:12px">Ver listas de útiles</button>
    </section>`;
  }

  const alumnos = alumnosActivosEnCarrito();
  const splitYaMostrado = new Set();

  let bloques = '';
  alumnos.forEach(al => {
    let rows = '';
    gradeKeys.filter(g => state.gradeAssign[g]===al.id).forEach(g => {
      GRADES[gradeNameOf(g)].items.forEach((it,i) => {
        const qty = state.gradeQtys[g][i]||0;
        if(!qty) return;
        rows += `<tr>
          <td>${esc(it.descripcion)}</td>
          <td class="num">${qty}</td>
          <td class="num">${money(it.precio_unitario)}</td>
          <td class="num">${money(qty*it.precio_unitario)}</td>
        </tr>`;
      });
      noDisponiblesDeLista(g).forEach(it => {
        rows += `<tr class="no-disponible"><td>${esc(it.descripcion)}</td><td class="num" colspan="3">No disponible · no incluido</td></tr>`;
      });
      rows += `<tr><td colspan="4" style="text-align:right;"><button class="btn-ghost" data-nav="utiles" data-open-grade="${esc(g)}">editar esta lista</button></td></tr>`;
    });
    state.uniformCart.forEach((u,idx) => {
      const units = (u.assign||{})[al.id] || 0;
      if(units<=0) return;
      const info = uniInfo(u.id);
      const mostrarSplit = !splitYaMostrado.has(idx);
      if(mostrarSplit) splitYaMostrado.add(idx);
      rows += `<tr>
        <td>${esc(info.name)} · talla ${esc(u.size)}${state.students.length>1 && u.qty>1 ? ' <span style="color:var(--ink-soft); font-size:0.78rem;">('+units+' de '+u.qty+')</span>' : ''}${mostrarSplit ? splitControlHtml(idx,u) : ''}</td>
        <td class="num">${units}</td>
        <td class="num">${money(info.price)}</td>
        <td class="num">${money(info.price*units)} <button class="btn-ghost" data-remove-uni="${idx}">quitar</button></td>
      </tr>`;
    });
    if(!rows) return;
    bloques += `<tr><td class="cart-group-title" colspan="4">👤 ${esc(nombreCompleto(al))}${al.grado ? ' · '+esc(gradoLargo(al.grado)) : ''} <span style="float:right; font-weight:400;">${money(subtotalAlumno(al.id))}</span></td></tr>${rows}`;
  });

  const faltaRepartir = !carritoRepartidoCompleto();
  const totalNoDisponibles = gradeKeys.reduce((n, g) => n + noDisponiblesDeLista(g).length, 0);

  return `
  <section class="view">
    <h2 style="margin-top:0">Tu carrito</h2>
    ${totalNoDisponibles ? `
      <div class="note-box error" style="margin-bottom:14px;">
        ⚠️ ${totalNoDisponibles === 1 ? 'Un artículo de tu lista no está disponible' : totalNoDisponibles+' artículos de tus listas no están disponibles'} por ahora, así que tu pedido <b>no es el paquete completo</b>. Los verás marcados abajo como "No disponible"; tendrás que conseguirlos por tu cuenta.
      </div>
    ` : ''}
    ${state.students.length ? `
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center;">
        ${state.students.map(al => `<span class="alumno-chip">👤 ${esc(nombreCompleto(al))}${subtotalAlumno(al.id)<=0?' (sin artículos aún)':''}</span>`).join('')}
        <button class="btn btn-secondary btn-sm" id="addStudentBtn">+ Agregar otro alumno(a)</button>
      </div>
    ` : ''}

function revisionComprobanteHtml(total){
  const r = state.comprobanteRevision;
  if(!r) return '';
  if(r.estado === 'revisando') return `<div class="note-box neutral" style="margin-top:10px;">🔎 Revisando tu comprobante… puede tardar unos segundos.</div>`;
  if(r.estado === 'ok') return `<div class="note-box" style="margin-top:10px;">✓ Comprobante revisado: encontramos el monto de ${money(total)} y los datos de la transferencia.</div>`;
  const motivos = [];
  if(r.estado === 'fallo') motivos.push('No pudimos leer la imagen en este momento. Revisa tu conexión y vuelve a subirla.');
  else if(r.duplicado) motivos.push('Este comprobante ya se usó en otro pedido. Cada pedido necesita su propia transferencia.');
  else {
    if(!r.montoOk) motivos.push(`No encontramos el monto exacto de ${money(total)}. Transfiere exactamente esa cantidad.`);
    if(r.palabras.length < 2) motivos.push('La imagen no parece un comprobante de transferencia bancaria.');
  }
  return `<div class="note-box error" style="margin-top:10px;">
    ⚠️ No pudimos validar tu comprobante:
    <ul style="margin:6px 0 6px 18px; padding:0;">${motivos.map(m => `<li>${esc(m)}</li>`).join('')}</ul>
    <div style="font-weight:400;">Sube la <b>captura de pantalla original</b> de tu app del banco (no una foto de la pantalla), donde se vea completo el monto, la clave de rastreo y la cuenta destino.</div>
  </div>`;
}

  const banner = listos.length && state.adminTab !== 'avisos'
    ? `<div class="note-box error" style="margin-top:12px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">

function checklistHtml(order){

  const terminado = order.stageIndex >= STAGES.length-1;
  const multi = order.alumnos && order.alumnos.length > 1;
  let rows = ''; let total = 0, checked = 0;
  order.items.utiles.forEach((it,i) => {
    const key = 'u'+i; total++; if(checklist[key]) checked++;
    const quien = multi ? ' — ' + esc(nombreAlumnoPorId(order, it.studentId)) : '';
    rows += `<label class="item-row" style="cursor:${terminado?'default':'pointer'};">
      <input type="checkbox" data-checklist="${key}" data-folio="${esc(order.folio)}" ${checklist[key]?'checked':''} ${terminado?'disabled':''} style="width:20px;height:20px;flex-shrink:0;">
      <div class="info"><div class="desc" style="${checklist[key]?'text-decoration:line-through;color:var(--ink-soft);':''}">${esc(it.descripcion)} x${it.qty}${quien}</div></div>
    </label>`;
  });
  order.items.uniformes.forEach((u,i) => {
    const key = 'f'+i; total++; if(checklist[key]) checked++;
    const reparto = multi && u.splits && u.splits.length ? ' — ' + u.splits.map(s=>esc(nombreAlumnoPorId(order,s.studentId))+': '+s.qty).join(', ') : '';
    rows += `<label class="item-row" style="cursor:${terminado?'default':'pointer'};">
      <input type="checkbox" data-checklist="${key}" data-folio="${esc(order.folio)}" ${checklist[key]?'checked':''} ${terminado?'disabled':''} style="width:20px;height:20px;flex-shrink:0;">
      <div class="info"><div class="desc" style="${checklist[key]?'text-decoration:line-through;color:var(--ink-soft);':''}">${esc(u.name)} (talla ${esc(u.size)}) x${u.qty}${reparto}</div></div>
    </label>`;
  });
  return `<div class="section-block">
    <div class="section-title"><span>Checklist de armado del paquete (${checked}/${total})</span></div>

  </div>`;
}

function cortesRows(){
  const f = state.cortesFilter;
  const desde = state.cortesDesde ? new Date(state.cortesDesde + 'T00:00:00') : null;
  const hasta = state.cortesHasta ? new Date(state.cortesHasta + 'T23:59:59') : null;
  return state.orders.filter(o => {
    if(f==='porcobrar' && o.pagoConfirmado) return false;
    if(f==='porcapturar' && !(o.pagoConfirmado && !o.capturadoInnovat)) return false;
    if(f==='capturados' && !o.capturadoInnovat) return false;
    const fecha = new Date(o.createdAt);
    if(desde && fecha < desde) return false;
    if(hasta && fecha > hasta) return false;
    return true;
  });
}

function exportCortesExcel(){
  if(typeof XLSX === 'undefined'){ alert('No se pudo cargar el generador de Excel. Revisa tu conexión.'); return; }
  const filas = cortesRows();
  // columnas din\u00e1micas: una por cada tipo de uniforme que aparezca (para capturarlo igual que en Innovat, pieza por pieza)
  const tiposUniforme = [];
  filas.forEach(o => { Object.keys(orderTotals(o).uniformesDetalle||{}).forEach(n => { if(!tiposUniforme.includes(n)) tiposUniforme.push(n); }); });
  const header = ['Folio','Fecha','Alumno','Grado','Método de pago','Pago confirmado','Papelería','Libros', ...tiposUniforme, 'Envío','Total','Capturado en Innovat'];
  const rows = [header];
  filas.forEach(o => {
    const t = orderTotals(o);
    const uniCols = tiposUniforme.map(n => (t.uniformesDetalle||{})[n] || 0);
    rows.push([o.folio, new Date(o.createdAt).toLocaleDateString('es-MX'), alumnosLabel(o), gradosLabel(o),
      o.payment==='transferencia' ? 'Transferencia' : 'Efectivo', o.pagoConfirmado ? 'Sí' : 'No',
      t.papeleria, t.libros, ...uniCols, o.deliveryFee||0, o.total||0, o.capturadoInnovat ? 'Sí' : 'No']);
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = header.map(h => ({ wch: Math.max(10, Math.min(28, h.length+2)) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Corte');
  XLSX.writeFile(wb, 'Corte_Innovat_' + new Date().toISOString().slice(0,10) + '.xlsx');
}

  const uniRows = [];
  uniformesVisibles().forEach(u => u.tallas.forEach(sz => { if(!filter || u.name.toLowerCase().includes(filter)) uniRows.push({u,sz}); }));
  if(uniRows.length){
    html += `<div class="section-block"><div class="section-title"><span>Uniformes</span></div>`;

}

async function guardarLista(){
  const L = state.listaEdit;
  const items = L.items
    .map(it => ({ seccion: SECCIONES_LISTA.includes(it.seccion) ? it.seccion : seccionDe(it.seccion), descripcion: String(it.descripcion||'').trim(),
      cantidad: Number(String(it.cantidad).replace(',','.'))||0, precio_unitario: Number(String(it.precio_unitario).replace(/[$,\s]/g,''))||0,
      stock: Math.max(0, parseInt(it.stock)||0) }))
    .filter(it => it.descripcion);
  if(!items.length){ L.mensaje = '⚠ La lista no tiene artículos.'; render(); return; }
  if(items.some(it => !(it.precio_unitario > 0))){ L.mensaje = '⚠ Hay artículos sin precio. Revisa la columna Precio.'; render(); return; }
  const docId = GRADES[L.grade] ? GRADES[L.grade].docId : slug(L.grade);
  const viejos = GRADES[L.grade] ? GRADES[L.grade].items.length : 0;
  const listaItems = items.map(({stock, ...it}) => Object.assign(it, { total: it.cantidad * it.precio_unitario }));
  const total_libros = listaItems.filter(it => it.seccion==='LIBROS').reduce((a,it) => a + it.total, 0);
  const total_paquete = listaItems.reduce((a,it) => a + it.total, 0);
  L.guardando = true; render();
  try{
    // el inventario de útiles va por posición (docId_índice), así que se reescribe completo para esta lista
    const batch = writeBatch(db);
    batch.set(doc(db, 'listas', docId), { nombre: L.grade, items: listaItems, total_libros, total_paquete });
    items.forEach((it, i) => batch.set(doc(db, 'inventario', docId+'_'+i), { tipo:'util', grado:L.grade, idx:i, descripcion:it.descripcion, precio_unitario:it.precio_unitario, stock:it.stock }));
    for(let j = items.length; j < viejos; j++) batch.delete(doc(db, 'inventario', docId+'_'+j));
    await batch.commit();
    GRADES[L.grade] = { docId, items: listaItems, total_libros, total_paquete };
    items.forEach((it, i) => { state.inventory[docId+'_'+i] = it.stock; });
    for(let j = items.length; j < viejos; j++) delete state.inventory[docId+'_'+j];
    abrirListaEdit(L.grade);
    state.listaEdit.mensaje = `✓ Lista de ${L.grade} guardada (${items.length} artículos, paquete completo ${money(total_paquete)}).`;
  }catch(err){
    console.error(err);
    L.guardando = false; L.mensaje = '⚠ No se pudo guardar la lista. Intenta de nuevo.';
  }
  render();
}

function ventasPedidos(){
  const ahora = new Date();
  const desde = { todo:null, mes:new Date(ahora.getFullYear(), ahora.getMonth(), 1), d30:new Date(ahora - 30*864e5), d7:new Date(ahora - 7*864e5) }[state.ventasPeriodo||'todo'];
  return state.orders.filter(o => (state.ventasAlcance==='todos' || o.pagoConfirmado) && (!desde || new Date(o.createdAt) >= desde));
}

// tasa de compra por artículo de lista: de las listas pedidas donde aparece el artículo, en cuántas lo compraron.
// Así un artículo que viene en las 6 listas (p. ej. papel américa) no "gana" solo por aparecer más veces.
function tasaDeCompra(pedidos){
  const porArt = {};
  pedidos.forEach(o => {
    const listas = {};   // una "lista pedida" = grado + alumno dentro del pedido
    ((o.items && o.items.utiles) || []).forEach(it => {
      const k = it.grade + '|' + (it.studentId||'');
      (listas[k] = listas[k] || { grade: it.grade, compras: {} }).compras[normTexto(it.descripcion)] = (listas[k].compras[normTexto(it.descripcion)]||0) + it.qty;
    });
    Object.values(listas).forEach(L => {
      const g = GRADES[L.grade];
      if(!g) return;
      g.items.forEach(item => {
        const k = normTexto(item.descripcion);
        const a = porArt[k] = porArt[k] || { nombre: item.descripcion, seccion: item.seccion, listas:0, compradas:0, piezas:0, sugeridas:0, monto:0 };
        a.listas++; a.sugeridas += Number(item.cantidad)||0;
        const q = L.compras[k] || 0;
        if(q > 0){ a.compradas++; a.piezas += q; a.monto += q * item.precio_unitario; }
      });
    });
  });
  return Object.values(porArt).map(a => Object.assign(a, { tasa: a.listas ? a.compradas / a.listas : 0 }));
}

function barrasH(filas, opts){
  // filas: [{label, valor, texto, tip}]; barras horizontales de un solo color, ancladas a la izquierda
  const max = opts.max || Math.max(1, ...filas.map(f => f.valor));
  return `<div class="hbars">${filas.map(f => `
    <div class="hbar-row" data-tip="${esc(f.tip || (f.label+': '+f.texto))}">
      <div class="hbar-label">${esc(f.label)}</div>
      <div class="hbar-track"><div class="hbar" style="width:${Math.max(0.5, f.valor/max*100).toFixed(1)}%"></div></div>
      <div class="hbar-val">${esc(f.texto)}</div>
    </div>`).join('')}</div>`;
}

function columnasTiempo(pedidos){
  if(!pedidos.length) return '<p class="viz-empty">Sin pedidos en este período.</p>';
  const porDia = {};
  pedidos.forEach(o => { const d = (o.createdAt||'').slice(0,10); porDia[d] = (porDia[d]||0) + (o.total||0); });
  const dias = Object.keys(porDia).sort();
  // rellena los días sin ventas para que el tiempo no se "comprima"
  const serie = [];
  for(let d = new Date(dias[0]+'T12:00'); d <= new Date(dias[dias.length-1]+'T12:00'); d = new Date(+d + 864e5)){
    const k = d.toISOString().slice(0,10); serie.push({ k, v: porDia[k]||0 });
  }
  const max = Math.max(1, ...serie.map(x => x.v));
  const fmt = k => new Date(k+'T12:00').toLocaleDateString('es-MX', { day:'numeric', month:'short' });
  return `<div class="cols" role="img" aria-label="Ingresos por día">
    ${serie.map(x => `<div class="col-slot" data-tip="${esc(fmt(x.k)+': '+money(x.v))}"><div class="col" style="height:${(x.v/max*100).toFixed(1)}%"></div></div>`).join('')}
  </div>
  <div class="cols-axis"><span>${esc(fmt(serie[0].k))}</span><span>máx. ${money(max)} en un día</span><span>${esc(fmt(serie[serie.length-1].k))}</span></div>`;
}

        ${arts.map(a => `<tr><td>${esc(a.nombre)}</td><td class="num">${a.listas}</td><td class="num">${a.compradas}</td><td class="num">${Math.round(a.tasa*100)}%</td><td class="num">${a.piezas} / ${a.sugeridas}</td><td class="num">${money(a.monto)}</td></tr>`).join('')}
        </tbody></table></div></details>`
      : '<p class="viz-empty">Aún no hay listas pedidas en este período.</p>'}
  </div>
  <div class="viz-grid">
    <div class="viz-card"><h3>Uniformes: piezas por prenda</h3>
      ${Object.keys(porPrenda).length ? barrasH(Object.entries(porPrenda).sort((a,b)=>b[1]-a[1]).map(([k,v]) => ({ label:k, valor:v, texto:v+' pzas' })), {}) : '<p class="viz-empty">Sin uniformes vendidos en este período.</p>'}</div>
    <div class="viz-card"><h3>Uniformes: tallas más pedidas</h3>
      ${Object.keys(porTalla).length ? barrasH(Object.entries(porTalla).sort((a,b)=>b[1]-a[1]).map(([k,v]) => ({ label:'Talla '+k, valor:v, texto:v+' pzas' })), {}) : '<p class="viz-empty">Sin uniformes vendidos en este período.</p>'}</div>
  </div>
  <p class="viz-nota">${state.ventasAlcance==='todos' ? 'Incluye pedidos con pago aún sin confirmar.' : 'Solo cuenta pedidos cuyo pago ya marcaste como confirmado, para que refleje dinero real recibido.'}</p>
  <div id="vizTip" class="viz-tip" hidden></div>`;
}

// alumnos, hermanos y reparto de uniformes
function eventosAlumnos(){

  if(state.pendingAssign){
    document.querySelectorAll('[data-assign-pick]').forEach(el => el.addEventListener('click', () => {
      asignarPendienteA(el.getAttribute('data-assign-pick'));
    }));
    const otherBtn = document.querySelector('[data-assign-other]');
    if(otherBtn) otherBtn.addEventListener('click', () => {
      state.pendingAssign.step = 'nuevo';
      if(!state.pendingAssign.nuevo) state.pendingAssign.nuevo = { nombres:'', apellidoPaterno:'', apellidoMaterno:'', grado:'' };
      render();
    });
    const cancelBtn = document.querySelector('[data-assign-cancel]');
    if(cancelBtn) cancelBtn.addEventListener('click', () => cancelarPendiente());
    ['panNombres','panApPaterno','panApMaterno'].forEach((id,idx) => {
      const field = ['nombres','apellidoPaterno','apellidoMaterno'][idx];
      const el = document.getElementById(id);
      if(el) el.addEventListener('input', () => {
        state.pendingAssign.nuevo[field] = el.value;
        const n = state.pendingAssign.nuevo;
        habilitar('#panGuardarBtn', (n.nombres||'').trim().length>1 && (n.apellidoPaterno||'').trim().length>1 && (n.apellidoMaterno||'').trim().length>1);
      });
    });
    const panGrado = document.getElementById('panGrado');
    if(panGrado) panGrado.addEventListener('change', () => { state.pendingAssign.nuevo.grado = panGrado.value; render(); });
    const panGuardar = document.getElementById('panGuardarBtn');
    if(panGuardar) panGuardar.addEventListener('click', () => {
      const n = state.pendingAssign.nuevo;
      if((n.nombres||'').trim().length<2 || (n.apellidoPaterno||'').trim().length<2 || (n.apellidoMaterno||'').trim().length<2) return;
      const student = { id:newStudentId(), nombres:n.nombres.trim(), apellidoPaterno:n.apellidoPaterno.trim(), apellidoMaterno:n.apellidoMaterno.trim(), grado:n.grado||'' };
      state.students.push(student);
      asignarPendienteA(student.id);
    });
  }

  const addStudentBtn = document.getElementById('addStudentBtn');

    state.pendingAssign = { kind:'manual', step:'nuevo', nuevo:{ nombres:'', apellidoPaterno:'', apellidoMaterno:'', grado:'' } };

  document.querySelectorAll('[data-split-dec]').forEach(el => el.addEventListener('click', () => {
    const [uniIdx, studentId] = el.getAttribute('data-split-dec').split('|');
    ajustarReparto(parseInt(uniIdx), studentId, -1);
  }));
}
